<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寻径教育 PathFinder · 系统能力思维导图</title>
<style>
  :root{
    --brand:#4353FF; --brand-d:#3340D6; --brand-100:#E8EAFF; --brand-200:#CDD2FF;
    --accent:#17C9A8; --accent-100:#E2F7F2; --accent-200:#B6ECE1;
    --ink:#172033; --ink-2:#5B6675; --ink-3:#8A94A6;
    --bg:#F6F9FF; --surface:#FFFFFF; --line:#E3EAF5;
    --r:10px; --sh:0 1px 2px rgba(23,32,51,.05), 0 6px 18px rgba(23,32,51,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------------- 顶栏 ---------------- */
  .top{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px;
    padding:12px 20px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top__brand{display:flex; align-items:center; gap:10px; min-width:0}
  .top__mark{
    width:30px; height:30px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,var(--brand),#6C7BFF); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .top__name{font-size:15px; font-weight:650; letter-spacing:.2px}
  .top__sub{font-size:12px; color:var(--ink-3)}
  .top__tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .btn{
    height:32px; padding:0 12px; border:1px solid var(--line); background:#fff; color:var(--ink-2);
    border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{border-color:var(--brand-200); color:var(--brand-d)}
  .btn--icon{width:32px; padding:0; font-size:15px}
  .scale-val{min-width:44px; text-align:center; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  /* ---------------- 画布 ---------------- */
  .stage{overflow:auto; padding:24px 20px 8px}
  .canvas-wrap{position:relative; margin:0 auto; transform-origin:top center}
  .canvas{position:relative}
  .wires{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  .nd{position:absolute; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);
      box-shadow:var(--sh); overflow:hidden}
  /* 根 */
  .nd--root{
    background:linear-gradient(135deg,var(--brand),#3A46E0); border:none; color:#fff;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:3px;
    box-shadow:0 8px 24px rgba(67,83,255,.28); text-align:center; padding:0 14px;
  }
  .nd--root b{font-size:19px; font-weight:700; letter-spacing:.5px}
  .nd--root span{font-size:12px; opacity:.88}
  .nd--root em{font-style:normal; font-size:11px; opacity:.72}
  /* 端 */
  .nd--side{display:flex; flex-direction:column; justify-content:center; padding:0 16px; border-width:1px}
  .nd--side b{font-size:17px; font-weight:700}
  .nd--side span{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .nd--t{border-color:var(--brand-200); background:var(--brand-100); padding-left:19px}
  .nd--t::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--brand)}
  .nd--t b{color:var(--brand-d)}
  .nd--s{border-color:var(--accent-200); background:var(--accent-100); padding-left:19px}
  .nd--s::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
  .nd--s b{color:var(--ink)}
  /* 能力分组 */
  .nd--grp{cursor:pointer; display:flex; align-items:center; gap:8px; padding:0 12px}
  .nd--grp:hover{box-shadow:0 4px 14px rgba(23,32,51,.10)}
  .nd--grp h4{margin:0; font-size:13.5px; font-weight:650; flex:1; min-width:0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nd--grp .n{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .nd--grp .fold{flex:none; width:18px; height:18px; border-radius:5px; background:rgba(255,255,255,.85);
      color:var(--ink-3); font-size:11px; line-height:18px; text-align:center}
  .nd--grp.is-closed .fold{background:var(--brand-100); color:var(--brand-d)}
  .nd--gt{background:#F3F5FF; border-color:#DCE2FF}
  .nd--gt::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brand)}
  .nd--gs{background:#EEFAF7; border-color:#CFEDE6}
  .nd--gs::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
  /* 功能节点 */
  .nd--item{display:flex; flex-direction:column; justify-content:center; padding:0 12px 0 14px; box-shadow:none}
  .nd--item h5{margin:0; font-size:13.5px; font-weight:650; color:var(--ink);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nd--item p{margin:2px 0 0; font-size:11.5px; line-height:1.45; color:var(--ink-3);
      overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .nd--it{border-color:#E4E8FB}
  .nd--it::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px;
      background:var(--brand-200); border-radius:2px}
  .nd--is{border-color:#DCF1EB}
  .nd--is::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:2px;
      background:var(--accent-200); border-radius:2px}
  /* ---------------- 底座 ---------------- */
  .base{max-width:1180px; margin:6px auto 40px; padding:0 20px}
  .base h3{margin:0 0 10px; font-size:14px; font-weight:650; color:var(--ink);
      display:flex; align-items:center; gap:8px}
  .base h3 i{font-style:normal; width:14px; height:3px; border-radius:2px; background:var(--brand); display:inline-block}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 14px;
      font-size:12.5px; color:var(--ink-2)}
  .chip b{color:var(--ink); font-weight:600}
  .note{margin-top:12px; font-size:12.5px; color:var(--ink-3); line-height:1.7}
  .note b{color:var(--ink-2)}
  @media print{
    .top{display:none}
    .stage{padding:0; overflow:visible}
    .canvas-wrap{transform:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__brand">
    <div class="top__mark">◆</div>
    <div>
      <div class="top__name">寻径教育 PathFinder · 系统能力思维导图</div>
      <div class="top__sub">教师端 / 学生端 · 各 3 项基础能力 + 5 项特色功能</div>
    </div>
  </div>
  <div class="top__tools">
    <button class="btn btn--icon" id="btn-out" title="缩小">－</button>
    <span class="scale-val" id="scale-val">100%</span>
    <button class="btn btn--icon" id="btn-in" title="放大">＋</button>
    <button class="btn" id="btn-fit">适应宽度</button>
    <button class="btn" id="btn-fold">全部折叠</button>
  </div>
</header>

<div class="stage" id="stage"><div class="canvas-wrap" id="wrap"><div class="canvas" id="canvas"></div></div></div>

<section class="base">
  <h3><i></i>两端共用的技术底座</h3>
  <div class="chips" id="chips"></div>
  <p class="note" id="note"></p>
</section>

<script>
(function () {
  "use strict";

  /* ============ 数据：按「能力」组织，不按页面数量 ============ */
  var DATA = {
    teacher: {
      title: "教师端", sub: "教 · 评 · 管",
      groups: [
        { name: "基础能力", items: [
          { n: "图文解析", d: "讲义 / 试卷上传即转可编辑文本" },
          { n: "知识抽取", d: "自动抽知识点，入库后可检索复用" },
          { n: "交互答疑", d: "多轮追问 + 溯源，答案可存为笔记" }
        ]},
        { name: "特色功能", items: [
          { n: "分层智能备课", d: "按层次出教案与 PPT，可预览下载" },
          { n: "个性化指导方案", d: "学情画像 → 团队与任务建议" },
          { n: "智能作业批改", d: "AI 给建议分与评语，教师确认" },
          { n: "教学资源匹配", d: "团队组建、企业资源、申请批复" },
          { n: "教学 Copilot", d: "一句话查学生 / 备课 / 讲知识点" }
        ]}
      ]
    },
    student: {
      title: "学生端", sub: "学 · 问 · 长",
      groups: [
        { name: "基础能力", items: [
          { n: "图文解析", d: "题目 / 资料拍照即可解析" },
          { n: "知识抽取", d: "抽取要点，沉淀进个人资料库" },
          { n: "交互答疑", d: "随时提问，答案一键存笔记" }
        ]},
        { name: "特色功能", items: [
          { n: "分层答疑", d: "同一问题按层次给不同深度的讲解" },
          { n: "画像与成长路线", d: "五维雷达 + 阶段任务打卡" },
          { n: "团队与资源申请", d: "推荐团队、项目申请、进度跟踪" },
          { n: "作业闭环", d: "在线作答，回看得分与评语" },
          { n: "个人知识库", d: "素材入库 + 导入教师共享资料" }
        ]}
      ]
    }
  };

  var BASE = [
    ["双引擎", "规则版 + 真实模型，失败自动降级"],
    ["六格矩阵", "学业型 / 事业型 × A / B / C，决定深度与难度"],
    ["混合检索", "BM25 + 向量双路召回，命中标注来源"],
    ["五种 RAG", "混合 / 图谱 / 智能体 / 纠错 / 多模态，自动路由"],
    ["数据隔离", "学生互不可见，共享需显式授权"],
    ["演示账号", "teacher / stu01，密码 123456"]
  ];
  var NOTE = "分层口径：平台产出的<b>分层结论只用于决定「推荐内容的深度」与「任务难度」</b>，不用于分班、不构成准入门槛；批改环节的 AI 只给<b>建议分</b>，最终分由教师确认。";

  /* ============ 布局常量 ============ */
  var W_ROOT = 220, W_SIDE = 164, W_GRP = 138, W_ITEM = 230;
  var H_ROOT = 92, H_SIDE = 68, H_GRP = 42, H_ITEM = 54;
  var GAP_ITEM = 10, PAD_GRP = 10, GAP_GRP = 20;
  var GAP_X_SIDE = 58, GAP_X1 = 40, GAP_X2 = 40, PAD_Y = 36;

  var state = { closed: {}, scale: 1 };
  var canvas = document.getElementById("canvas");
  var wrap = document.getElementById("wrap");
  var stage = document.getElementById("stage");

  function grpH(side, i) {
    var g = DATA[side].groups[i];
    return H_GRP + (state.closed[side + i] ? 0 : g.items.length * H_ITEM + (g.items.length - 1) * GAP_ITEM) + PAD_GRP;
  }
  function sideH(side) {
    var n = DATA[side].groups.length, h = 0;
    for (var i = 0; i < n; i++) h += grpH(side, i);
    return h + (n - 1) * GAP_GRP;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function wire(x1, y1, x2, y2, cls) {
    var dx = Math.abs(x2 - x1) * 0.45;
    return '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 - dx) + ' ' + y1 + ',' + (x2 + dx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '" class="' + cls + '"/>';
  }

  function render() {
    var H = Math.max(sideH("teacher"), sideH("student"), H_ROOT) + PAD_Y * 2;
    var W = W_ROOT + 2 * (GAP_X_SIDE + W_SIDE + GAP_X1 + W_GRP + GAP_X2 + W_ITEM) + PAD_Y * 2;

    var cx = W / 2, cy = H / 2;
    var rootX = cx - W_ROOT / 2, rootY = cy - H_ROOT / 2;
    var wires = [], nodes = [];

    nodes.push('<div class="nd nd--root" style="left:' + rootX + 'px;top:' + rootY + 'px;width:' + W_ROOT +
      'px;height:' + H_ROOT + 'px"><b>寻径教育 PathFinder</b><span>学业—就业双轨导航</span><em>基础能力 + 端侧特色</em></div>');

    var sides = [
      { k: "teacher", dir: -1, cls: "t" },
      { k: "student", dir: 1, cls: "s" }
    ];

    sides.forEach(function (sd) {
      var d = DATA[sd.k], n = d.groups.length;
      var sh = sideH(sd.k);
      var sideX = sd.dir < 0 ? rootX - GAP_X_SIDE - W_SIDE : rootX + W_ROOT + GAP_X_SIDE;
      var sideY = cy - H_SIDE / 2;
      var top = cy - sh / 2;

      nodes.push('<div class="nd nd--side nd--' + sd.cls + '" style="left:' + sideX + 'px;top:' + sideY +
        'px;width:' + W_SIDE + 'px;height:' + H_SIDE + 'px"><b>' + esc(d.title) + '</b><span>' + esc(d.sub) + '</span></div>');

      if (sd.dir < 0) wires.push(wire(sideX + W_SIDE, sideY + H_SIDE / 2, rootX, cy, "w" + sd.cls));
      else wires.push(wire(rootX + W_ROOT, cy, sideX, sideY + H_SIDE / 2, "w" + sd.cls));

      var y = top;
      for (var i = 0; i < n; i++) {
        var g = d.groups[i], gh = grpH(sd.k, i);
        var gX = sd.dir < 0 ? sideX - GAP_X1 - W_GRP : sideX + W_SIDE + GAP_X1;
        var closed = !!state.closed[sd.k + i];

        nodes.push('<div class="nd nd--grp nd--g' + sd.cls + (closed ? " is-closed" : "") +
          '" data-grp="' + sd.k + i + '" style="left:' + gX + 'px;top:' + y + 'px;width:' + W_GRP +
          'px;height:' + H_GRP + 'px;z-index:2" title="点击折叠 / 展开">' +
          "<h4>" + esc(g.name) + '</h4><span class="n">' + g.items.length + '</span>' +
          '<span class="fold">' + (closed ? "+" : "−") + "</span></div>");

        if (sd.dir < 0) wires.push(wire(sideX, sideY + H_SIDE / 2, gX + W_GRP, y + H_GRP / 2, "w" + sd.cls));
        else wires.push(wire(sideX + W_SIDE, sideY + H_SIDE / 2, gX, y + H_GRP / 2, "w" + sd.cls));

        if (!closed) {
          var itX = sd.dir < 0 ? gX - GAP_X2 - W_ITEM : gX + W_GRP + GAP_X2;
          for (var j = 0; j < g.items.length; j++) {
            var it = g.items[j];
            var itY = y + H_GRP + 5 + j * (H_ITEM + GAP_ITEM);
            nodes.push('<div class="nd nd--item nd--i' + sd.cls + '" style="left:' + itX + 'px;top:' + itY +
              'px;width:' + W_ITEM + 'px;height:' + H_ITEM + 'px"><h5>' + esc(it.n) + "</h5><p>" + esc(it.d) + "</p></div>");
            if (sd.dir < 0) wires.push(wire(itX + W_ITEM, itY + H_ITEM / 2, gX, y + H_GRP / 2, "wc" + sd.cls));
            else wires.push(wire(gX + W_GRP, y + H_GRP / 2, itX, itY + H_ITEM / 2, "wc" + sd.cls));
          }
        }
        y += gh + GAP_GRP;
      }
    });

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.innerHTML =
      '<svg class="wires" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
      '<style>.wt,.ws{fill:none;stroke-width:2}.wc-t,.wc-s{fill:none;stroke-width:1.4}' +
      ".wt{stroke:rgba(67,83,255,.40)}.ws{stroke:rgba(23,201,168,.44)}" +
      ".wc-t{stroke:rgba(67,83,255,.24)}.wc-s{stroke:rgba(23,201,168,.28)}</style>" +
      wires.join("") + "</svg>" + nodes.join("");

    applyScale();
  }

  function applyScale() {
    wrap.style.width = canvas.style.width;
    wrap.style.height = parseFloat(canvas.style.height) * state.scale + "px";
    canvas.style.transform = "scale(" + state.scale + ")";
    canvas.style.transformOrigin = "top left";
    document.getElementById("scale-val").textContent = Math.round(state.scale * 100) + "%";
  }

  function fit() {
    var avail = stage.clientWidth - 44;
    var w = parseFloat(canvas.style.width);
    state.scale = Math.max(0.35, Math.min(1, avail / w));
    applyScale();
  }

  /* ============ 交互 ============ */
  canvas.addEventListener("click", function (e) {
    var el = e.target.closest("[data-grp]");
    if (!el) return;
    var k = el.getAttribute("data-grp");
    if (state.closed[k]) delete state.closed[k]; else state.closed[k] = 1;
    render();
  });
  document.getElementById("btn-in").addEventListener("click", function () {
    state.scale = Math.min(1.4, state.scale + 0.1); applyScale();
  });
  document.getElementById("btn-out").addEventListener("click", function () {
    state.scale = Math.max(0.3, state.scale - 0.1); applyScale();
  });
  document.getElementById("btn-fit").addEventListener("click", fit);
  document.getElementById("btn-fold").addEventListener("click", function () {
    var any = Object.keys(state.closed).length;
    state.closed = {};
    if (!any) {
      ["teacher", "student"].forEach(function (k) {
        DATA[k].groups.forEach(function (g, i) { state.closed[k + i] = 1; });
      });
      this.textContent = "全部展开";
    } else {
      this.textContent = "全部折叠";
    }
    render();
  });
  window.addEventListener("resize", function () { if (state.scale < 1) fit(); });

  /* ============ 底座 ============ */
  document.getElementById("chips").innerHTML = BASE.map(function (b) {
    return '<span class="chip"><b>' + esc(b[0]) + "</b> · " + esc(b[1]) + "</span>";
  }).join("");
  document.getElementById("note").innerHTML = NOTE;

  render();
  fit();
})();
</script>
</body>
</html>
