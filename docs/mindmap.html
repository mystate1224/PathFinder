<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寻径教育 PathFinder · 系统功能思维导图</title>
<style>
  :root{
    --brand:#4353FF; --brand-d:#3340D6; --brand-100:#E8EAFF; --brand-200:#CDD2FF;
    --accent:#17C9A8; --accent-100:#E2F7F2; --accent-200:#B6ECE1;
    --ink:#172033; --ink-2:#5B6675; --ink-3:#8A94A6;
    --bg:#F6F9FF; --surface:#FFFFFF; --line:#E3EAF5;
    --r:10px; --sh:0 1px 2px rgba(23,32,51,.05), 0 6px 18px rgba(23,32,51,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------------- 顶栏 ---------------- */
  .top{
    position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px;
    padding:12px 20px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top__brand{display:flex; align-items:center; gap:10px; min-width:0}
  .top__mark{
    width:30px; height:30px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,var(--brand),#6C7BFF); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .top__name{font-size:15px; font-weight:650; letter-spacing:.2px}
  .top__sub{font-size:12px; color:var(--ink-3)}
  .top__tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .btn{
    height:32px; padding:0 12px; border:1px solid var(--line); background:#fff; color:var(--ink-2);
    border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .btn:hover{border-color:var(--brand-200); color:var(--brand-d)}
  .btn--icon{width:32px; padding:0; font-size:15px}
  .scale-val{min-width:44px; text-align:center; font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}
  /* ---------------- 画布 ---------------- */
  .stage{overflow:auto; padding:24px 20px 8px}
  .canvas-wrap{position:relative; margin:0 auto; transform-origin:top center}
  .canvas{position:relative}
  .wires{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
  .nd{position:absolute; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);
      box-shadow:var(--sh); overflow:hidden}
  /* 根 */
  .nd--root{
    background:linear-gradient(135deg,var(--brand),#3A46E0); border:none; color:#fff;
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px;
    box-shadow:0 8px 24px rgba(67,83,255,.28); text-align:center; padding:0 14px;
  }
  .nd--root b{font-size:19px; font-weight:700; letter-spacing:.5px}
  .nd--root span{font-size:12px; opacity:.88}
  .nd--root em{font-style:normal; font-size:11px; opacity:.7}
  /* 端 */
  .nd--side{display:flex; flex-direction:column; justify-content:center; padding:0 16px; border-width:1px}
  .nd--side b{font-size:17px; font-weight:700}
  .nd--side span{font-size:11.5px; color:var(--ink-3); margin-top:2px}
  .nd--t{border-color:var(--brand-200); background:var(--brand-100); padding-left:19px}
  .nd--t::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--brand)}
  .nd--t b{color:var(--brand-d)}
  .nd--s{border-color:var(--accent-200); background:var(--accent-100); padding-left:19px}
  .nd--s::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent)}
  .nd--s b{color:var(--ink)}
  /* 模块 */
  .nd--mod{cursor:pointer; transition:box-shadow .18s ease, border-color .18s ease}
  .nd--mod:hover{box-shadow:0 4px 16px rgba(23,32,51,.10)}
  .nd--mod .mh{height:52px; padding:0 12px; display:flex; align-items:center; gap:8px}
  .nd--mod .mh:hover{background:rgba(67,83,255,.04)}
  .nd--mod h4{margin:0; font-size:14.5px; font-weight:650; flex:1; min-width:0;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nd--mod .path{font-size:11px; color:var(--ink-3); font-family:ui-monospace,Menlo,Consolas,monospace}
  .nd--mod .fold{flex:none; width:18px; height:18px; border-radius:5px; background:#F1F5FB; color:var(--ink-3);
      font-size:11px; line-height:18px; text-align:center}
  .nd--mod.is-closed .fold{background:var(--brand-100); color:var(--brand-d)}
  .nd--mt{border-color:var(--brand-200)}
  .nd--mt .mh{border-bottom:1px solid #EEF1FB; background:linear-gradient(180deg,#FAFBFF,#fff)}
  .nd--ms{border-color:var(--accent-200)}
  .nd--ms .mh{border-bottom:1px solid #EDF8F5; background:linear-gradient(180deg,#F8FDFC,#fff)}
  /* 子项 */
  .nd--child{
    display:flex; align-items:center; border-radius:8px; box-shadow:none;
    font-size:13px; color:var(--ink-2); padding:0 12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .nd--ct{border-color:#E6E9FB}
  .nd--ct::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
      background:var(--brand-200); border-radius:2px}
  .nd--cs{border-color:#DDF1EC}
  .nd--cs::before{content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px;
      background:var(--accent-200); border-radius:2px}
  /* ---------------- 底座 ---------------- */
  .base{max-width:1180px; margin:6px auto 40px; padding:0 20px}
  .base h3{margin:0 0 10px; font-size:14px; font-weight:650; color:var(--ink);
      display:flex; align-items:center; gap:8px}
  .base h3 i{font-style:normal; width:14px; height:3px; border-radius:2px; background:var(--brand); display:inline-block}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:#fff; border:1px solid var(--line); border-radius:999px; padding:6px 14px;
      font-size:12.5px; color:var(--ink-2)}
  .chip b{color:var(--ink); font-weight:600}
  .note{margin-top:12px; font-size:12.5px; color:var(--ink-3); line-height:1.7}
  .note b{color:var(--ink-2)}
  @media print{
    .top{display:none}
    .stage{padding:0; overflow:visible}
    .canvas-wrap{transform:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top__brand">
    <div class="top__mark">◆</div>
    <div>
      <div class="top__name">寻径教育 PathFinder · 系统功能思维导图</div>
      <div class="top__sub">教师端 7 个模块 / 学生端 6 个模块 · 双引擎可离线演示</div>
    </div>
  </div>
  <div class="top__tools">
    <button class="btn btn--icon" id="btn-out" title="缩小">－</button>
    <span class="scale-val" id="scale-val">100%</span>
    <button class="btn btn--icon" id="btn-in" title="放大">＋</button>
    <button class="btn" id="btn-fit">适应宽度</button>
    <button class="btn" id="btn-fold">全部折叠</button>
  </div>
</header>

<div class="stage" id="stage"><div class="canvas-wrap" id="wrap"><div class="canvas" id="canvas"></div></div></div>

<section class="base">
  <h3><i></i>两端共用的底座能力</h3>
  <div class="chips" id="chips"></div>
  <p class="note" id="note"></p>
</section>

<script>
(function () {
  "use strict";

  /* ============ 数据：与代码里的页面 / 页签一一对应 ============ */
  var DATA = {
    teacher: {
      title: "教师端", sub: "教学 + 事务 · 7 个模块",
      mods: [
        { name: "教师驾驶舱", path: "/teacher", items: [
          "班级学情总览（分布方框）",
          "主标签 / 层次 / 兴趣分布",
          "学生画像库（五维雷达）",
          "我的团队：建 / 改 / 删",
          "任教班级切换器"
        ]},
        { name: "备课助手", path: "/teach", items: [
          "教案生成：目标 / 重难点 / 环节",
          "PPT 生成（真 .pptx，可编辑）",
          "上传讲义直接出 PPT",
          "我的产物：预览 / 下载"
        ]},
        { name: "作业批改", path: "/homework", items: [
          "作业卡 ⇄ 批改视图（同一页）",
          "逐份打分 / 修改 / 缺交记 0",
          "布置 / 编辑 / 删除作业",
          "自由试批 & 批量试批（不入库）",
          "成绩 CSV 导出"
        ]},
        { name: "教师 Copilot", path: "/tutor", items: [
          "一句话查学生 / 备课 / 讲知识点",
          "意图路由：备课 / 讲解 / 查学生",
          "溯源卡 + 引擎徽标",
          "五类一键演示例子",
          "多轮会话管理"
        ]},
        { name: "师生匹配", path: "/match", items: [
          "推荐候选 + 匹配分",
          "团队管理（名额 / 方向 / 类型）",
          "企业资源发布与管理",
          "学生申请批复"
        ]},
        { name: "资料与知识库", path: "/library", items: [
          "上传解析：PDF / Word / 图片",
          "知识点抽取并入库",
          "课件在线预览 / 打开",
          "检索实验室（双路召回）"
        ]},
        { name: "个人中心", path: "/profile", items: [
          "账号信息与任教班级",
          "偏好设置与明暗主题"
        ]}
      ]
    },
    student: {
      title: "学生端", sub: "成长 + 事务 · 6 个模块",
      mods: [
        { name: "我的画像", path: "/student", items: [
          "五维能力雷达图",
          "主标签 + 分层（六格矩阵）",
          "成长路线（阶段任务）",
          "我的任务：增 / 改 / 完成"
        ]},
        { name: "师生匹配", path: "/match", items: [
          "推荐团队 + 匹配分",
          "资源广场（企业项目）",
          "我的申请（进度跟踪）",
          "我的匹配记录"
        ]},
        { name: "学生 Copilot", path: "/ask", items: [
          "分层答疑（A / B / C 深度不同）",
          "图文解析 + 知识点抽取",
          "五种 RAG 架构自动路由",
          "答案存笔记进资料库",
          "多轮会话管理"
        ]},
        { name: "我的作业", path: "/homework", items: [
          "待完成：在线作答 / 传附件",
          "全部作业：得分与评语",
          "截止时间与提交状态"
        ]},
        { name: "我的资料库", path: "/library", items: [
          "上传素材并建立索引",
          "教师共享资料导入",
          "知识点库（按课程聚合）",
          "检索实验室（双路召回）"
        ]},
        { name: "个人中心", path: "/profile", items: [
          "账号信息与学习画像",
          "偏好设置与明暗主题"
        ]}
      ]
    }
  };

  var BASE = [
    ["双引擎", "规则版 + 真实模型，失败自动降级，断网也能演示"],
    ["六格矩阵", "学业型 / 事业型 × A / B / C，决定推荐深度与任务难度"],
    ["混合检索", "BM25 + 向量双路召回，RRF 融合，命中标注来源"],
    ["五种 RAG", "混合 / 图谱 / 智能体 / 纠错 / 多模态，自动路由可手切"],
    ["数据隔离", "同学之间互不可见，教师共享需显式导入"],
    ["演示账号", "teacher / stu01，密码统一 123456"]
  ];
  var NOTE = "分层口径：平台产出的<b>分层结论只用于决定「推荐内容的深度」与「任务难度」</b>，不用于分班、不构成准入门槛；批改环节的 AI 只给<b>建议分</b>，最终分由教师确认。";

  /* ============ 布局常量 ============ */
  var W_CHILD = 216, W_MOD = 240, W_SIDE = 184, W_ROOT = 240;
  var H_CHILD = 30, H_MOD = 52, PAD_MOD = 10, GAP_MOD = 18;
  var GAP_X = 46, GAP_X_SIDE = 68, PAD_Y = 40;
  var H_ROOT = 96, H_SIDE = 76;

  var state = { closed: {}, scale: 1 };
  var canvas = document.getElementById("canvas");
  var wrap = document.getElementById("wrap");
  var stage = document.getElementById("stage");

  function blockH(side, i) {
    var m = DATA[side].mods[i];
    return H_MOD + (state.closed[side + i] ? 0 : m.items.length * H_CHILD) + PAD_MOD;
  }
  function sideH(side) {
    var n = DATA[side].mods.length, h = 0;
    for (var i = 0; i < n; i++) h += blockH(side, i);
    return h + (n - 1) * GAP_MOD;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function wire(x1, y1, x2, y2, cls) {
    var dx = Math.abs(x2 - x1) * 0.45;
    return '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 - dx) + ' ' + y1 + ',' + (x2 + dx) + ' ' + y2 + ',' + x2 + ' ' + y2 + '" class="' + cls + '"/>';
  }

  function render() {
    var H = Math.max(sideH("teacher"), sideH("student")) + PAD_Y * 2;
    var W = W_ROOT + 2 * (GAP_X_SIDE + W_SIDE + GAP_X + W_MOD + GAP_X + W_CHILD) + PAD_Y * 2;

    var cx = W / 2, cy = H / 2;
    var rootX = cx - W_ROOT / 2, rootY = cy - H_ROOT / 2;
    var wires = [], nodes = [];

    /* 根 */
    nodes.push('<div class="nd nd--root" style="left:' + rootX + 'px;top:' + rootY + 'px;width:' + W_ROOT +
      'px;height:' + H_ROOT + 'px"><b>寻径教育 PathFinder</b><span>学业—就业双轨导航</span><em>教师端 7 · 学生端 6</em></div>');

    var sides = [
      { k: "teacher", dir: -1, cls: "t", color: "#4353FF", soft: "rgba(67,83,255,.34)" },
      { k: "student", dir: 1, cls: "s", color: "#17C9A8", soft: "rgba(23,201,168,.38)" }
    ];

    sides.forEach(function (sd) {
      var d = DATA[sd.k], n = d.mods.length;
      var sh = sideH(sd.k);
      var sideX = sd.dir < 0 ? rootX - GAP_X_SIDE - W_SIDE : rootX + W_ROOT + GAP_X_SIDE;
      var sideY = cy - H_SIDE / 2;
      var top = cy - sh / 2;

      nodes.push('<div class="nd nd--side nd--' + sd.cls + '" style="left:' + sideX + 'px;top:' + sideY +
        'px;width:' + W_SIDE + 'px;height:' + H_SIDE + 'px"><b>' + esc(d.title) + '</b><span>' + esc(d.sub) + '</span></div>');

      /* 端 → 根 */
      if (sd.dir < 0) wires.push(wire(sideX + W_SIDE, sideY + H_SIDE / 2, rootX, cy, "w" + sd.cls));
      else wires.push(wire(rootX + W_ROOT, cy, sideX, sideY + H_SIDE / 2, "w" + sd.cls));

      var y = top;
      for (var i = 0; i < n; i++) {
        var m = d.mods[i], bh = blockH(sd.k, i);
        var modX = sd.dir < 0 ? sideX - GAP_X - W_MOD : sideX + W_SIDE + GAP_X;
        var closed = !!state.closed[sd.k + i];

        nodes.push('<div class="nd nd--mod nd--m' + sd.cls + (closed ? " is-closed" : "") +
          '" data-mod="' + sd.k + i + '" style="left:' + modX + 'px;top:' + y + 'px;width:' + W_MOD +
          'px;height:' + bh + 'px;z-index:2" title="点击折叠 / 展开">' +
          '<div class="mh"><h4>' + esc(m.name) + '</h4><span class="path">' + esc(m.path) + '</span>' +
          '<span class="fold">' + (closed ? "+" : "−") + "</span></div></div>");

        /* 端 → 模块 */
        if (sd.dir < 0) wires.push(wire(sideX, sideY + H_SIDE / 2, modX + W_MOD, y + H_MOD / 2, "w" + sd.cls));
        else wires.push(wire(sideX + W_SIDE, sideY + H_SIDE / 2, modX, y + H_MOD / 2, "w" + sd.cls));

        if (!closed) {
          var chX = sd.dir < 0 ? modX - GAP_X - W_CHILD : modX + W_MOD + GAP_X;
          for (var j = 0; j < m.items.length; j++) {
            var chY = y + H_MOD + 4 + j * H_CHILD;
            nodes.push('<div class="nd nd--child nd--c' + sd.cls + '" style="left:' + chX + 'px;top:' + chY +
              'px;width:' + W_CHILD + 'px;height:' + (H_CHILD - 4) + 'px">' + esc(m.items[j]) + "</div>");
            if (sd.dir < 0) wires.push(wire(chX + W_CHILD, chY + (H_CHILD - 4) / 2, modX, y + H_MOD / 2, "wc" + sd.cls));
            else wires.push(wire(modX + W_MOD, y + H_MOD / 2, chX, chY + (H_CHILD - 4) / 2, "wc" + sd.cls));
          }
        }
        y += bh + GAP_MOD;
      }
    });

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    canvas.innerHTML =
      '<svg class="wires" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
      '<style>.wt,.ws{fill:none;stroke-width:2}.wc-t,.wc-s{fill:none;stroke-width:1.4}' +
      ".wt{stroke:rgba(67,83,255,.40)}.ws{stroke:rgba(23,201,168,.44)}" +
      ".wc-t{stroke:rgba(67,83,255,.26)}.wc-s{stroke:rgba(23,201,168,.30)}</style>" +
      wires.join("") + "</svg>" + nodes.join("");

    applyScale();
  }

  function applyScale() {
    wrap.style.width = canvas.style.width;
    wrap.style.height = parseFloat(canvas.style.height) * state.scale + "px";
    canvas.style.transform = "scale(" + state.scale + ")";
    canvas.style.transformOrigin = "top left";
    document.getElementById("scale-val").textContent = Math.round(state.scale * 100) + "%";
  }

  function fit() {
    var avail = stage.clientWidth - 44;
    var w = parseFloat(canvas.style.width);
    state.scale = Math.max(0.35, Math.min(1, avail / w));
    applyScale();
  }

  /* ============ 交互 ============ */
  canvas.addEventListener("click", function (e) {
    var el = e.target.closest("[data-mod]");
    if (!el) return;
    var k = el.getAttribute("data-mod");
    if (state.closed[k]) delete state.closed[k]; else state.closed[k] = 1;
    render();
  });
  document.getElementById("btn-in").addEventListener("click", function () {
    state.scale = Math.min(1.4, state.scale + 0.1); applyScale();
  });
  document.getElementById("btn-out").addEventListener("click", function () {
    state.scale = Math.max(0.3, state.scale - 0.1); applyScale();
  });
  document.getElementById("btn-fit").addEventListener("click", fit);
  document.getElementById("btn-fold").addEventListener("click", function () {
    var any = Object.keys(state.closed).length;
    state.closed = {};
    if (!any) {
      ["teacher", "student"].forEach(function (k) {
        DATA[k].mods.forEach(function (m, i) { state.closed[k + i] = 1; });
      });
      this.textContent = "全部展开";
    } else {
      this.textContent = "全部折叠";
    }
    render();
  });
  window.addEventListener("resize", function () { if (state.scale < 1) fit(); });

  /* ============ 底座 ============ */
  document.getElementById("chips").innerHTML = BASE.map(function (b) {
    return '<span class="chip"><b>' + esc(b[0]) + "</b> · " + esc(b[1]) + "</span>";
  }).join("");
  document.getElementById("note").innerHTML = NOTE;

  render();
  fit();
})();
</script>
</body>
</html>
