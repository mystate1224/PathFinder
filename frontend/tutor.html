<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师 Copilot · 寻径教育 PathFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82a0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css">
<script>/* 主题引导：抢在首帧之前定下明暗，否则会先亮一帧白再变暗。
   刻意不依赖任何外部文件与 window.PF。用户在顶栏选过则以 localStorage 为准，
   没选过就跟随系统 prefers-color-scheme。 */
(function(){var t=null;try{t=localStorage.getItem("pf_theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
  .cp-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s-5); align-items: start; }
  @media (max-width: 1080px) { .cp-wrap { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/tabs.js"></script>
<script>
(async function () {
  const PF = window.PF;

  const me = await PF.requireAuth("teacher");
  if (!me) return;

  const view = PF.shell({
    active: "tutor",
    me: me,
    title: "教师 Copilot",
    desc: "用一句自然语言把日常动作做完：查某个学生的画像、备一节课、讲清一个知识点。意图由规则词典路由，结果如实标注是「AI 生成」还是「规则生成」。",
    wide: true,
    actions: '<button class="btn" id="btn-clear">' + PF.icon("trash", 15) + "清空对话</button>",
  });

  const SKILLS_FALLBACK = [
    { value: "student", label: "查学生", hint: "例：看看张三的画像 / stu03 的成绩如何" },
    { value: "lesson", label: "备课", hint: "例：帮我备一节注意力机制（拓展型）" },
    { value: "explain", label: "讲知识点", hint: "例：讲一下反向传播，要能直接上课用" },
  ];
  let SKILLS = SKILLS_FALLBACK;

  const EXAMPLES = [
    "帮我备一节注意力机制的课，拓展型",
    "讲一下反向传播，要能直接上课用",
    "看看 stu03 的成绩如何",
    "班里成绩分布怎么样",
  ];

  view.innerHTML =
    '<div class="cp-wrap">' +
      '<div class="stack">' +
        '<div class="card">' +
          '<div class="card__head"><h3>' + PF.icon("sparkles", 15) + " 对话" +
            ' <span class="t-xs" style="font-weight:400">（最近 2 轮会带上，便于追问）</span></h3>' +
            '<div class="card__head-actions"><span class="badge badge--brand" id="b-intent">等待提问</span></div>' +
          "</div>" +
          '<div class="card__body"><div class="chat" id="chat">' + PF.loading("正在读取历史") + "</div></div>" +
          '<div class="card__foot"><div class="composer stack">' +
            '<div class="row" style="gap:6px;flex-wrap:wrap" id="ex-row"></div>' +
            '<div class="row" style="align-items:flex-end;gap:8px;margin-top:8px">' +
              '<textarea class="input flex-1" id="c-input" rows="2" ' +
                'placeholder="直接说你想做什么，例如：帮我备一节朴素贝叶斯的课（巩固型）"></textarea>' +
              '<button class="btn btn--primary" id="btn-send">' + PF.icon("send", 15) + "发送</button>" +
            "</div>" +
            '<div class="row"><span class="t-xs t-dim">Ctrl / ⌘ + Enter 发送</span>' +
              '<div class="spacer"></div>' +
              '<span class="t-xs t-dim" id="c-skill-hint"></span></div>' +
          "</div></div>" +
        "</div>" +
      "</div>" +

      '<div class="stack">' +
        '<div class="card"><div class="card__head"><h3>能力范围</h3></div>' +
          '<div class="card__body stack-sm" id="skills"></div>' +
          '<div class="card__foot">' + PF.caveat(
            "当前形态是「规则词典路由 + 单次模型调用」，三个分支是固定动作，不是可自主调用工具的 Agent。这样做的取舍是稳定性优先。" ) +
          "</div>" +
        "</div>" +
        '<div class="card"><div class="card__head"><h3>它能拿到什么数据</h3></div>' +
          '<div class="card__body stack-sm">' +
            '<div class="t-sm" style="line-height:1.8">' +
              "查学生：本班学生的画像、能力短板、掌握度偏低的知识点与待办任务<br>" +
              "备课：先检索你上传的课件，再出教案（可直接去「备课助手」导出 docx / pptx）<br>" +
              "讲知识点：检索课件原文，按「一句话结论 / 三个层次 / 学生常问的问题」组织" +
            "</div>" +
            '<div class="t-xs t-dim">所有结果都不会出现分班或给学生贴标签的表述。</div>' +
          "</div>" +
        "</div>" +
      "</div>" +
    "</div>";

  /* ---------------------------------------------------------- 侧栏技能 */
  function paintSkills() {
    PF.$("#skills").innerHTML = PF.arr(SKILLS).map(function (s, i) {
      return '<button class="btn btn--sm skill-chip" data-skill="' + PF.esc(s.value) + '">' +
        "<span>" + PF.icon("target", 12) + " " + PF.esc(s.label) + "</span>" +
        '<span class="t-xs t-dim" style="font-weight:400">' + PF.esc(s.hint || "") + "</span></button>";
    }).join("");
    PF.$$("[data-skill]", view).forEach(function (b) {
      b.addEventListener("click", function () {
        const s = PF.arr(SKILLS).filter(function (x) { return x.value === b.dataset.skill; })[0] || {};
        PF.$("#c-input").value = (s.hint || "").replace(/^例：/, "");
        PF.$("#c-skill-hint").textContent = "已锁定意图：" + (s.label || "");
        LOCKED = b.dataset.skill;
        PF.$("#c-input").focus();
      });
    });
  }

  PF.$("#ex-row").innerHTML = EXAMPLES.map(function (q) {
    return '<button class="btn btn--sm" data-ex="' + PF.esc(q) + '">' + PF.esc(q) + "</button>";
  }).join("");
  PF.$$("[data-ex]", view).forEach(function (b) {
    b.addEventListener("click", function () {
      PF.$("#c-input").value = b.dataset.ex;
      LOCKED = "";
      PF.$("#c-skill-hint").textContent = "";
      send();
    });
  });

  let LOCKED = "";

  /* ---------------------------------------------------------- 消息渲染 */
  function renderMsg(m) {
    const isUser = m.role === "user";
    const data = m.data || {};
    return '<div class="msg ' + (isUser ? "msg--user" : "msg--ai") + '">' +
      '<div class="msg__avatar">' + (isUser ? PF.esc(PF.initial(me.name)) : "AI") + "</div>" +
      '<div class="msg__bubble">' +
        '<div class="msg__meta">' +
          '<span class="t-xs t-strong">' + (isUser ? "我" : "Copilot") + "</span>" +
          (!isUser && m.intent_label ? '<span class="badge badge--brand">' + PF.esc(m.intent_label) + "</span>" : "") +
          (!isUser && m.engine ? PF.engineBadge(m.engine) : "") +
          '<div class="spacer"></div>' +
          (m.created_at ? '<span class="t-xs t-dim">' + PF.esc(PF.when(m.created_at)) + "</span>" : "") +
        "</div>" +
        PF.esc(m.content || "") +
        (!isUser && m.intent === "student" ? studentBlock(data) : "") +
        (!isUser && m.intent === "lesson" ? lessonBlock(data) : "") +
        (!isUser && m.intent === "explain" ? explainBlock(data) : "") +
      "</div></div>";
  }

  function studentBlock(data) {
    const students = PF.arr(data.students);
    if (!students.length) return "";
    return '<div class="mt-3 stack-sm">' + students.map(function (s) {
      const abilities = PF.arr(s.ability_pairs);
      const weak = abilities.length
        ? abilities.filter(function (p) { return p.value !== undefined; })
            .sort(function (a, b) { return (a.value || 0) - (b.value || 0); })[0]
        : null;
      return '<div class="mini-student">' +
        '<div class="mini-student__name">' + PF.esc(s.name || s.username || "学生") +
          ' <span class="t-xs t-dim">' + PF.esc(s.username || "") + "</span></div>" +
        '<div class="mini-meta">' +
          (s.track ? PF.trackBadge(s.track) : "") +
          (s.grade_level ? PF.levelTag(s.grade_level, true) : "") +
          (s.gpa !== undefined && s.gpa !== null ? '<span class="badge">绩点 ' + PF.num(s.gpa, 2) + "</span>" : "") +
          (weak ? '<span class="badge badge--danger">短板 ' + PF.esc(weak.name) + "</span>" : "") +
        "</div>" +
      "</div>";
    }).join("") +
    '<div class="row"><a class="btn btn--sm" href="/teacher#/tab=students">' +
      PF.icon("users", 12) + "去画像库看完整画像</a></div></div>";
  }

  function lessonBlock(data) {
    const plan = data.plan || {};
    if (!plan.title) return "";
    return '<div class="mt-3 stack-sm">' +
      '<div class="row" style="gap:6px;flex-wrap:wrap">' +
        '<span class="badge badge--brand">' + PF.esc(plan.orientation || "—") + "取向</span>" +
        '<span class="badge">' + PF.num(plan.periods, 0) + " 课时 / " + PF.num(plan.total_minutes, 0) + " 分钟</span>" +
        (data.engine ? PF.engineBadge(data.engine) : "") +
      "</div>" +
      (PF.arr(plan.outline).length
        ? '<div class="t-sm" style="line-height:1.8">' + PF.arr(plan.outline).map(function (s) {
            return "· " + PF.esc(s.step) + "（" + PF.num(s.minutes, 0) + " 分钟）";
          }).join("　") + "</div>"
        : "") +
      '<div class="row"><a class="btn btn--sm" href="/teach#/tab=lesson">' +
        PF.icon("book", 12) + "去备课助手导出 docx</a></div></div>";
  }

  function explainBlock(data) {
    const refs = PF.arr(data.refs);
    if (!refs.length) return "";
    return '<div class="mt-3"><div class="t-xs t-dim">引用依据（' + refs.length + " 条）：" +
      refs.slice(0, 4).map(function (r) { return PF.esc(r); }).join("　") + "</div></div>";
  }

  /* ---------------------------------------------------------- 历史与发送 */
  async function loadHistory() {
    const chat = PF.$("#chat");
    let d;
    try {
      d = await PF.get("/api/teacher/copilot/history?limit=20");
    } catch (e) {
      chat.innerHTML = PF.empty({ icon: "alert", title: "历史加载失败", desc: e.message });
      return;
    }
    const msgs = PF.arr(d.messages);
    if (!msgs.length) {
      chat.innerHTML =
        '<div class="msg msg--ai"><div class="msg__avatar">AI</div>' +
          '<div class="msg__bubble">我是这门课的教师 Copilot。' +
          "可以直接给我一句话：\n\n" +
          "· 查学生 —— 「看看 stu03 的成绩如何」「班里成绩分布怎么样」\n" +
          "· 备课 —— 「帮我备一节注意力机制的课，拓展型」「出一份期末练习卷」\n" +
          "· 讲知识点 —— 「讲一下反向传播，要能直接上课用」\n\n" +
          "答案只引用你上传的课件原文，没有依据会直接说明。</div></div>";
      return;
    }
    chat.innerHTML = msgs.map(function (m) {
      return renderMsg({ role: m.role, content: m.content, engine: m.engine, created_at: m.created_at });
    }).join("");
    scrollBottom();
  }

  function scrollBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  async function send() {
    const input = PF.$("#c-input");
    const q = input.value.trim();
    if (!q) { PF.toast("请先输入你想做什么", "warn"); return; }
    const btn = PF.$("#btn-send");
    const chat = PF.$("#chat");
    if (chat.querySelector(".empty")) chat.innerHTML = "";

    const u = document.createElement("div");
    u.innerHTML = renderMsg({ role: "user", content: q, created_at: new Date().toISOString() });
    chat.appendChild(u.firstElementChild);

    const pending = document.createElement("div");
    pending.className = "msg msg--ai";
    pending.innerHTML = '<div class="msg__avatar">AI</div><div class="msg__bubble">' +
      '<div class="msg__meta"><span class="t-xs t-strong">Copilot</span>' +
      '<span class="t-xs t-dim">正在判定意图并组织结果…</span></div><span class="spin"></span></div>';
    chat.appendChild(pending);

    input.value = "";
    PF.busy(btn, true, "处理中");
    scrollBottom();

    try {
      const d = await PF.post("/api/teacher/copilot/ask", { question: q, skill: LOCKED });
      if (PF.arr(d.skills).length) { SKILLS = d.skills; paintSkills(); }
      pending.innerHTML = renderMsg({
        role: "assistant", content: d.answer, intent: d.intent, intent_label: d.intent_label,
        engine: d.engine, created_at: new Date().toISOString(), data: d.data,
      });
      PF.$("#b-intent").textContent = d.intent_label || d.intent || "—";
      scrollBottom();
    } catch (e) {
      pending.innerHTML = '<div class="msg__avatar">AI</div><div class="msg__bubble">' +
        PF.esc("处理失败：" + e.message) + "</div>";
    } finally {
      PF.busy(btn, false);
      PF.$("#c-skill-hint").textContent = "";
      LOCKED = "";
    }
  }

  PF.$("#btn-send").addEventListener("click", send);
  PF.$("#c-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });

  PF.$("#btn-clear").addEventListener("click", async function () {
    const yes = await PF.confirm({
      title: "清空对话",
      text: "会删除全部 Copilot 对话历史，不可恢复。",
      okText: "清空", danger: true,
    });
    if (!yes) return;
    try {
      await PF.post("/api/teacher/copilot/clear");
    } catch (e) { /* 已提示 */ }
    PF.$("#b-intent").textContent = "等待提问";
    await loadHistory();
    PF.toast("对话已清空", "ok");
  });

  paintSkills();
  await loadHistory();
})();
</script>
</body>
</html>
