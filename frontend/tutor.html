<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师 Copilot · 寻径教育 PathFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82a0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css?v=30">
<script>/* 主题引导：抢在首帧之前定下明暗，否则会先亮一帧白再变暗。
   刻意不依赖任何外部文件与 window.PF。用户在顶栏选过则以 localStorage 为准，
   没选过就跟随系统 prefers-color-scheme。 */
(function(){var t=null;try{t=localStorage.getItem("pf_theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
  .qa-foot-row { display: flex; gap: 8px; align-items: flex-end; }
  .qa-foot-row .input { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/js/common.js?v=14"></script>
<script src="/static/js/tabs.js"></script>
<script>
(async function () {
  const PF = window.PF;

  const me = await PF.requireAuth("teacher");
  if (!me) return;

  const view = PF.shell({
    active: "tutor",
    me: me,
    title: "教师 Copilot",
    desc: "用一句话把日常动作做完：查学生、备课、讲知识点、定评分标准。结果会如实标注是「AI 生成」还是「规则生成」。",
    wide: true,
    actions:
      PF.demoMenuHtml([
        { key: "text", icon: "file", label: "文本素材例子", hint: "课件 / 论文：解析 + 抽知识点 + 溯源" },
        { key: "image", icon: "image", label: "图片素材例子", hint: "手写作业图：去水印 + 读图 + 答疑" },
        { key: "prep", icon: "presentation", label: "备课例子", hint: "教案 + PPT（≤10 页）+ 作业，真生成并入库" },
        { key: "coach", icon: "users", label: "指导学生例子", hint: "取真实画像画雷达图 + 画像解读 + 建议" },
        { key: "review", icon: "briefcase", label: "项目申请例子", hint: "待处理申请列表 + 建议 + 真批复" },
      ], { label: "例子演示", tip: "挑一个，跑一遍完整流程（会真的调用接口）" }) +
      PF.chatActionsHtml(),
  });
  PF.bindDemoMenu(PF.$("[data-dm-menu]"), function (k) {
    if (k === "prep") { runPrep(); return; }
    if (k === "coach") { runCoach(); return; }
    if (k === "review") { runReview(); return; }
    runDemo(k);
  });

  view.innerHTML =
    '<div class="qa-shell" id="qa-shell">' +
      '<div class="qa-dock">' +
        '<div class="sess-head">' +
          '<span class="sess-head__title">' + PF.icon("message", 14) + "对话</span>" +
          '<button class="sess-new" id="btn-new">' + PF.icon("plus", 13) + "新开对话</button>" +
        "</div>" +
        '<div class="sess-list" id="qa-history"></div>' +
      "</div>" +
      '<div class="qa-grip" id="qa-grip" role="separator" aria-orientation="vertical" tabindex="0"></div>' +
      '<div class="qa-main">' +
        '<div class="qa-main__scroll" id="chat">' + PF.loading("正在读取对话") + "</div>" +
        '<div class="qa-main__foot">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' +
            '<span class="t-xs t-dim" id="c-skill-hint">直接说你想做什么就行</span>' +
            PF.ragSelect("c-rag", "auto", 116) +
            '<div class="spacer"></div>' +
            '<span class="t-xs t-dim">Ctrl / ⌘ + Enter 发送</span>' +
          "</div>" +
          '<div class="qa-foot-row">' +
            '<textarea class="input" id="c-input" rows="2" ' +
              'placeholder="直接说你想做什么，例如：帮我备一节朴素贝叶斯的课（巩固型）"></textarea>' +
            '<button class="btn btn--primary" id="btn-send">' + PF.icon("send", 15) + "发送</button>" +
          "</div>" +
        "</div>" +
      "</div>" +
      '<div class="qa-side">' +
        '<div id="agent-card"></div>' +
      "</div>" +
    "</div>";

  /* ---------------------------------------------------------- 布局 */
  const shell = PF.$("#qa-shell");
  PF.fitHeight(shell, 24);
  const dock = PF.bindDock({ shell: shell, grip: PF.$("#qa-grip"), open: false });
  PF.$("#btn-hist").addEventListener("click", function () { dock.toggle(); });

  /* ---------------------------------------------------------- 数据：一轮对话 */
  const API_BASE = "/api/teacher/copilot";
  let ROUNDS = [];
  let CURRENT = -1;

  function groupRounds(msgs) {
    const out = [];
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role !== "user") continue;
      const ans = msgs[i + 1] && msgs[i + 1].role === "assistant" ? msgs[i + 1] : null;
      out.push({
        q: m.content || "", at: m.created_at || "",
        a: ans ? ans.content : "", refs: [], data: null,
        intent: "", intent_label: "", engine: (ans && ans.engine) || "", qa: null, rag: null,
      });
    }
    return out;
  }

  /* ---------------------------------------------------------- 会话：新开 / 回到某一次 */
  // el 传 null：会话与「本次对话的每一轮」画在同一个滚动区里，由 paintDock 统一渲染。
  const sess = PF.sessionList({ el: null, api: API_BASE, onPick: function (sid) { loadHistory(sid); } });

  PF.$("#btn-new").addEventListener("click", async function () {
    await sess.create();
    ROUNDS = []; CURRENT = -1;
    paintRound(-1);
    PF.toast("已新开一次对话", "ok");
  });

  function paintDock() {
    const box = PF.$("#qa-history");
    const list = sess.items || [];
    let html = '<div class="sess-sec">全部会话（' + list.length + "）</div>";
    html += list.length
      ? list.map(function (s) {
          return '<button class="qa-dock__item' + (s.session_id === sess.current ? " is-on" : "") +
            '" data-sid="' + PF.esc(s.session_id) + '">' +
            '<div class="qa-dock__q">' + PF.esc(PF.trunc(s.title || "（空会话）", 28)) + "</div>" +
            '<div class="qa-dock__t">' + PF.num(s.turns, 0) + " 条 · " +
            PF.esc(PF.when(s.last_at)) + "</div></button>";
        }).join("")
      : '<div class="t-xs t-dim" style="padding:2px 4px 8px">还没有对话，点上面「新开对话」。</div>';

    if (ROUNDS.length) {
      html += '<div class="sess-sec">本次对话（' + ROUNDS.length + "）</div>" +
        ROUNDS.map(function (r, i) {
          return '<button class="qa-dock__item is-turn' + (i === CURRENT ? " is-on" : "") +
            '" data-r="' + i + '">' +
            '<div class="qa-dock__q">' + PF.esc(PF.trunc(r.q || "（空）", 34)) + "</div>" +
            '<div class="qa-dock__t">' + PF.esc(PF.when(r.at)) +
            (r.rag && r.rag.strategy_name ? " · " + PF.esc(r.rag.strategy_name) : "") + "</div></button>";
        }).join("");
    }
    box.innerHTML = html;
    PF.$$("[data-sid]", box).forEach(function (b) {
      b.addEventListener("click", function () { sess.pick(b.dataset.sid); });
    });
    PF.$$("[data-r]", box).forEach(function (b) {
      b.addEventListener("click", function () { paintRound(Number(b.dataset.r)); });
    });
  }

  function renderMsg(m) {
    const isUser = m.role === "user";
    const data = m.data || {};
    return '<div class="msg ' + (isUser ? "msg--user" : "msg--ai") + '">' +
      '<div class="msg__avatar">' + (isUser ? PF.esc(PF.initial(me.name)) : "AI") + "</div>" +
      '<div class="msg__bubble">' +
        '<div class="msg__meta">' +
          '<span class="t-xs t-strong">' + (isUser ? "我" : "Copilot") + "</span>" +
          (!isUser && m.intent_label ? '<span class="badge badge--brand">' + PF.esc(m.intent_label) + "</span>" : "") +
          (!isUser && m.engine ? PF.engineBadge(m.engine) : "") +
          '<div class="spacer"></div>' +
          (m.created_at ? '<span class="t-xs t-dim">' + PF.esc(PF.when(m.created_at)) + "</span>" : "") +
        "</div>" +
        PF.esc(m.content || "") +
        (m.attach || "") +
        (!isUser && m.demo ? PF.demoAnswerBody(m.demo, FOLDERS, "teacher") : "") +
        (!isUser && m.guide ? PF.demoGuideBody(m.guide, m.guideKey, FOLDERS, "teacher") : "") +
        (!isUser && m.prep ? PF.prepResultHtml(m.prep) : "") +
        (!isUser && m.coach ? PF.coachResultHtml(m.coach) : "") +
        (!isUser && m.review ? PF.reviewResultHtml(m.review) : "") +
        (!isUser && m.tguide ? PF.teacherGuideBody(m.tguide, FOLDERS) : "") +
        (!isUser && m.intent === "student" ? studentBlock(data) : "") +
        (!isUser && m.intent === "lesson" ? lessonBlock(data) : "") +
        (!isUser && m.intent === "explain" ? explainBlock(data) : "") +
        (!isUser && m.intent === "grading" ? gradingBlock(data) : "") +
        (!isUser && m.rag ? PF.ragCard(m.rag) : "") +
        (!isUser && m.synth ? PF.synthCard(m.synth) : "") +
        PF.qaBlock(m.qa) +
      "</div></div>";
  }

  function studentBlock(data) {
    const students = PF.arr(data.students);
    if (!students.length) return "";
    return '<div class="mt-3 stack-sm">' + students.map(function (s) {
      const abilities = PF.arr(s.ability_pairs);
      const weak = abilities.length
        ? abilities.filter(function (p) { return p.value !== undefined; })
            .sort(function (a, b) { return (a.value || 0) - (b.value || 0); })[0]
        : null;
      return '<div class="mini-student">' +
        '<div class="mini-student__name">' + PF.esc(s.name || s.username || "学生") +
          ' <span class="t-xs t-dim">' + PF.esc(s.username || "") + "</span></div>" +
        '<div class="mini-meta">' +
          (s.track ? PF.trackBadge(s.track) : "") +
          (s.grade_level ? PF.levelTag(s.grade_level, true) : "") +
          (s.gpa !== undefined && s.gpa !== null ? '<span class="badge">绩点 ' + PF.num(s.gpa, 2) + "</span>" : "") +
          (weak ? '<span class="badge badge--danger">短板 ' + PF.esc(weak.name) + "</span>" : "") +
        "</div>" +
      "</div>";
    }).join("") +
    '<div class="row"><a class="btn btn--sm" href="/teacher#/tab=students">' +
      PF.icon("users", 12) + "去画像库看完整画像</a></div></div>";
  }

  function lessonBlock(data) {
    const plan = data.plan || {};
    if (!plan.title) return "";
    return '<div class="mt-3 stack-sm">' +
      '<div class="row" style="gap:6px;flex-wrap:wrap">' +
        '<span class="badge badge--brand">' + PF.esc(plan.orientation || "—") + "取向</span>" +
        '<span class="badge">' + PF.num(plan.periods, 0) + " 课时 / " + PF.num(plan.total_minutes, 0) + " 分钟</span>" +
        (data.engine ? PF.engineBadge(data.engine) : "") +
      "</div>" +
      (PF.arr(plan.outline).length
        ? '<div class="t-sm" style="line-height:1.8">' + PF.arr(plan.outline).map(function (s) {
            return "· " + PF.esc(s.step) + "（" + PF.num(s.minutes, 0) + " 分钟）";
          }).join("　") + "</div>"
        : "") +
      '<div class="row"><a class="btn btn--sm" href="/teach#/tab=lesson">' +
        PF.icon("book", 12) + "去备课助手导出 docx</a></div></div>";
  }

  function explainBlock(data) {
    const refs = PF.arr(data.refs);
    if (!refs.length) return "";
    return '<div class="mt-3"><div class="t-xs t-dim">引用依据（' + refs.length + " 条）：" +
      refs.slice(0, 4).map(function (r) { return PF.esc(r); }).join("　") + "</div></div>";
  }

  function gradingBlock(data) {
    const rub = data.rubric || {};
    if (!rub.A) return "";
    return '<div class="mt-3 stack-sm">' +
      ["A", "B", "C"].map(function (k) {
        return '<div class="t-xs"><b>' + k + " 档：</b>" + PF.esc(rub[k] || "") + "</div>";
      }).join("") +
      (PF.arr(data.deductions).length
        ? '<div class="t-xs t-dim">常见扣分点：' +
          PF.arr(data.deductions).map(function (x) { return PF.esc(x); }).join("；") + "</div>"
        : "") +
      '<div class="row"><a class="btn btn--sm" href="/grade">' +
        PF.icon("book", 12) + "去批改中心</a></div></div>";
  }

  function paintRound(i) {
    CURRENT = i;
    const chat = PF.$("#chat");
    if (i < 0 || !ROUNDS[i]) {
      chat.innerHTML =
        '<div class="msg msg--ai"><div class="msg__avatar">AI</div>' +
          '<div class="msg__bubble">老师您好，我是助教小寻。可以直接给我一句话：\n\n' +
          "· 查学生 —— 「看看 stu03 的成绩如何」\n" +
          "· 备课 —— 「帮我备一节注意力机制的课，拓展型」\n" +
          "· 讲知识点 —— 「讲一下反向传播，要能直接上课用」\n" +
          "· 批改标准 —— 「这份作业怎么给分？」\n\n" +
          "答案只引用你上传的课件原文，没有依据会直接说明。" +
          "左侧「对话」里能新开一次，也能回到以前某一次接着问。</div></div>";
      paintDock();
      return;
    }
    const r = ROUNDS[i];
    if (r.demo) {
      chat.innerHTML =
        renderMsg({ role: "user", content: r.q, created_at: r.at, attach: r.attach }) +
        renderMsg({ role: "assistant", content: "", created_at: r.at,
                    intent: "", intent_label: "资料解析", engine: "rule",
                    data: {}, refs: [], demo: r.demo });
      bindFollowups(chat);
      PF.bindNoteSaver(chat, { onSaved: function () { sess.refresh(); } });
      PF.bindGuides(chat, { onPick: runGuide });
      paintDock();
      const el = PF.$("#chat");
      el.scrollTop = el.scrollHeight;
      return;
    }
    if (r.guide) {
      chat.innerHTML =
        renderMsg({ role: "user", content: r.q, created_at: r.at, attach: r.attach }) +
        renderMsg({ role: "assistant", content: "", created_at: r.at,
                    intent: "", intent_label: r.layer || "作业讲评", engine: "rule",
                    data: {}, refs: [], guide: r.guide, guideKey: r.guideKey });
      PF.bindNoteSaver(chat, { onSaved: function () { sess.refresh(); } });
      paintDock();
      const el = PF.$("#chat");
      el.scrollTop = el.scrollHeight;
      return;
    }
    // v7.9 教师演示：备课（真生成三件产物）/ 指导学生（真取画像画雷达图）/
    // 项目申请（真批复）/ 演示之后的引导
    if (r.prep || r.coach || r.review || r.tguide) {
      const label = r.tguide ? (r.tguide.label || "教师演示")
        : (r.review ? "项目申请" : (r.prep ? "备课" : "指导学生"));
      chat.innerHTML =
        renderMsg({ role: "user", content: r.q, created_at: r.at, attach: r.attach }) +
        renderMsg({ role: "assistant", content: "", created_at: r.at,
                    intent: "", intent_label: r.intent_label || label, engine: "rule",
                    data: {}, refs: [],
                    prep: r.prep, coach: r.coach, review: r.review, tguide: r.tguide });
      PF.bindGuides(chat, { onPick: runGuide });
      PF.bindReviewDecide(chat, { onDone: function () { sess.refresh(); } });
      paintDock();
      const el = PF.$("#chat");
      el.scrollTop = el.scrollHeight;
      return;
    }
    chat.innerHTML =
      renderMsg({ role: "user", content: r.q, created_at: r.at }) +
      (r.a ? renderMsg({ role: "assistant", content: r.a, intent: r.intent, intent_label: r.intent_label,
                         engine: r.engine, created_at: r.at, data: r.data, qa: r.qa,
                         rag: r.rag, synth: r.synth || (r.data || {}).synth }) : "");
    bindFollowups(chat);
    paintDock();
    const el = PF.$("#chat");
    el.scrollTop = el.scrollHeight;
  }

  function bindFollowups(scope) {
    PF.$$("[data-fu]", scope).forEach(function (b) {
      b.addEventListener("click", function () {
        PF.$("#c-input").value = b.dataset.fu;
        send();
      });
    });
  }

  /* ---------------------------------------------------------- 智能体简介卡
     右栏从 v7.12 起只留这一张：原来的「智能体工具」与「它能做什么」两张卡撤掉了
     （上传资料走 /library、能力说明在简介卡的「能答 / 怎么答」里已经有了）。 */
  (async function loadAgentCard() {
    const m = await PF.try(function () { return PF.get("/api/manual", { quiet: true }); }, null);
    const a = (m && m.agents && m.agents.teacher) || {
      name: "教师助手",
      one_line: "一句话让它干活：查学生、备课、讲知识点、定评分标准。",
      answers: ["查学生", "备课", "讲知识点", "批改标准", "班级学情"],
      how: "判断你想做什么 → 取数据或查资料 → 给出可直接用的结果",
      ground: "查事实用班里的真实数据，讲内容用你上传的资料，两者分开展示",
      caveat: "它按固定流程工作，不会自己去做你没让它做的事。",
    };
    PF.$("#agent-card").innerHTML = PF.agentCard(Object.assign({ btnId: "btn-manual" }, a));
    PF.$("#btn-manual").addEventListener("click", function () { PF.manual("qa"); });
  })();

  /* ---------------------------------------------------------- 演示例子（写死）
     与学生 Copilot 共用同一组素材：文本=线性代数矩阵，图片=C 语言指针笔记。
     教师视角的差异只在于提示词与保存路径的默认值。 */
  const CATS = (await PF.try(function () {
    return PF.get("/api/materials/overview", { quiet: true });
  }, null)) || {};
  const FOLDERS = PF.arr(CATS.categories);

  function runDemo(key) {
    const demo = PF.COPILOT_DEMOS[key];
    if (!demo) return;
    const at = new Date().toISOString();
    ROUNDS.push({ q: demo.prompt, a: "", refs: [], data: null, intent: "",
                  intent_label: "资料解析", engine: "rule",
                  at: at, qa: null, rag: null, demo: demo, attach: PF.demoAttach(demo) });
    CURRENT = ROUNDS.length - 1;
    paintDock();
    PF.$("#chat").innerHTML =
      renderMsg({ role: "user", content: demo.prompt, created_at: at, attach: PF.demoAttach(demo) }) +
      '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
        '<div class="msg__meta"><span class="t-xs t-strong">Copilot</span>' +
        '<span class="badge badge--brand">资料解析</span>' + PF.engineBadge("rule") + "</div>" +
        '<span class="spin"></span> <span class="t-sm t-dim">正在解析' + PF.esc(demo.kind) +
        "素材、抽取知识点，并检索相关课件做溯源…</span></div></div>";
    const chatEl = PF.$("#chat");
    chatEl.scrollTop = chatEl.scrollHeight;
    setTimeout(function () { paintRound(CURRENT); }, 650);
  }

  /* ---------------------------------------------------------- 教师演示（v7.9）
     与学生侧写死的素材演示不同，备课与指导学生这两个**真跑接口**：
       ① 备课 —— 教案 → PPT（≤10 页）→ 作业，三步真实生成并入库；
       ② 指导学生 —— 真实取学生画像画雷达图，给解读与建议。
     真跑的理由：演示里出现的东西必须能在别的页面真的翻到，写死的产物一查就穿帮。 */
  let DEMO_BUSY = false;

  function pushRound(q, extra) {
    const at = new Date().toISOString();
    const r = Object.assign({ q: q, a: "", refs: [], data: null, intent: "", intent_label: "",
                              engine: "rule", at: at, qa: null, rag: null }, extra || {});
    ROUNDS.push(r);
    CURRENT = ROUNDS.length - 1;
    paintDock();
    return r;
  }

  /** 演示进行中的「正在…」气泡；#dm-step 这一步的文字会被逐阶段改写。 */
  function paintWaiting(q, label, text) {
    PF.$("#chat").innerHTML =
      renderMsg({ role: "user", content: q, created_at: new Date().toISOString() }) +
      '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
        '<div class="msg__meta"><span class="t-xs t-strong">Copilot</span>' +
        '<span class="badge badge--brand">' + PF.esc(label) + "</span>" +
        PF.engineBadge("rule") + "</div>" +
        '<span class="spin"></span> <span class="t-sm t-dim" id="dm-step">' +
        PF.esc(text) + "</span></div></div>";
    const el = PF.$("#chat");
    el.scrollTop = el.scrollHeight;
  }

  function setStep(t) {
    const el = PF.$("#dm-step");
    if (el) el.textContent = t;
  }

  async function runPrep() {
    if (DEMO_BUSY) return;
    const cfg = PF.TEACHER_DEMOS.prep;
    // 作业按「教学班」分发，先问后端我现在带的是哪个班（取不到就交给后端报错兜底）
    const cls = await PF.try(function () {
      return PF.get("/api/teacher/classes", { quiet: true });
    }, null);
    const r = pushRound(cfg.title, { intent_label: "备课", prep: null });
    paintWaiting(cfg.title, "备课", "正在检索备课资料…");
    DEMO_BUSY = true;
    try { r.prep = await PF.runPrepDemo({ class_name: (cls && cls.current) || "" }, setStep); }
    finally { DEMO_BUSY = false; }
    paintRound(CURRENT);
    PF.toast(PF.arr(r.prep.errors).length ? "备课演示跑完了，有步骤没成功" : "三件产物都生成好了", "ok");
  }

  async function runCoach() {
    if (DEMO_BUSY) return;
    const cfg = PF.TEACHER_DEMOS.coach;
    const r = pushRound(cfg.title, { intent_label: "指导学生", coach: null });
    paintWaiting(cfg.title, "指导学生", "正在班里定位「" + cfg.student + "」…");
    DEMO_BUSY = true;
    try { r.coach = await PF.runCoachDemo({}, setStep); }
    finally { DEMO_BUSY = false; }
    paintRound(CURRENT);
  }

  async function runReview() {
    if (DEMO_BUSY) return;
    const cfg = PF.TEACHER_DEMOS.review;
    const r = pushRound(cfg.title, { intent_label: "项目申请", review: null });
    paintWaiting(cfg.title, "项目申请", "正在读你发布的资源与收到的申请…");
    DEMO_BUSY = true;
    try { r.review = await PF.runReviewDemo({}, setStep); }
    finally { DEMO_BUSY = false; }
    paintRound(CURRENT);
  }

  /** 教师演示之后的引导：每条都真的去做一件事（生成拓展教案 / 存一份资料）。 */
  async function runTeacherGuide(gkey) {
    if (DEMO_BUSY) return;
    DEMO_BUSY = true;
    try {
      await PF.runTeacherGuide(gkey, {
        push: function (g) {
          const r = pushRound(g.ask, { intent_label: g.label || "教师演示", tguide: g });
          paintWaiting(g.ask, g.label || "教师演示", "正在处理…");
          return { chat: PF.$("#chat") };
        },
        paint: function () { paintRound(CURRENT); },
      });
    } finally { DEMO_BUSY = false; }
  }

  /* 引导问答（教师侧）：文案用 askT（讲评/课堂练习视角），流程与学生侧同构；
     "prep.*" / "coach.*" 是教师演示的引导，走另一条真跑接口的路径。 */
  function runGuide(gkey) {
    if (/^(prep|coach|review)\./.test(String(gkey))) { runTeacherGuide(gkey); return; }
    PF.runCopilotGuide(gkey, {
      side: "teacher",
      push: function (guide, k) {
        const at = new Date().toISOString();
        const ask = guide.askT || guide.ask;
        const layer = guide.labelT || guide.label || "资料解析";
        const attach = guide.attach ? PF.demoAttach(guide.attach) : "";
        ROUNDS.push({ q: ask, a: "", refs: [], data: null, intent: "",
                      intent_label: layer, engine: "rule",
                      at: at, qa: null, rag: null,
                      guide: guide, guideKey: k, attach: attach });
        CURRENT = ROUNDS.length - 1;
        paintDock();
        PF.$("#chat").innerHTML =
          renderMsg({ role: "user", content: ask, created_at: at, attach: attach }) +
          '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
            '<div class="msg__meta"><span class="t-xs t-strong">Copilot</span>' +
            '<span class="badge badge--brand">' + PF.esc(layer) + "</span>" +
            PF.engineBadge("rule") + "</div>" +
            '<span class="spin"></span> <span class="t-sm t-dim">' +
            (guide.upload ? "正在调取作业图并逐题解析…" : "正在生成结果…") + "</span></div></div>";
        const chatEl = PF.$("#chat");
        chatEl.scrollTop = chatEl.scrollHeight;
        setTimeout(function () { paintRound(CURRENT); }, 650);
        return { chat: chatEl, side: "teacher" };
      },
    });
  }

  /* ---------------------------------------------------------- 发送 */
  async function send() {
    const input = PF.$("#c-input");
    const q = input.value.trim();
    if (!q) { PF.toast("请先输入你想做什么", "warn"); return; }
    const btn = PF.$("#btn-send");

    ROUNDS.push({ q: q, a: "", refs: [], data: null, intent: "", intent_label: "",
                  engine: "", at: new Date().toISOString(), qa: null, rag: null });
    CURRENT = ROUNDS.length - 1;
    PF.$("#chat").innerHTML =
      renderMsg({ role: "user", content: q, created_at: ROUNDS[CURRENT].at }) +
      '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
        '<div class="msg__meta"><span class="t-xs t-strong">Copilot</span>' +
        '<span class="t-xs t-dim">正在判定你想做什么并组织结果…</span></div><span class="spin"></span></div></div>';
    input.value = "";
    PF.$("#c-skill-hint").textContent = "已收到，正在判断你想做什么…";
    PF.busy(btn, true, "处理中");
    paintDock();

    try {
      const d = await PF.post(API_BASE + "/ask", {
        question: q,                                   // skill 不传：让它自己判断你想做什么
        session_id: sess.current,                      // 不传后端新开一次；传了就续上
        strategy: PF.$("#c-rag").value || "auto",      // auto = 按问题自动选五种架构之一
      });
      /* 后端会带回它能做的事（d.skills），右栏不再列卡片，这里只把识别到的能力
         在输入框上方提示一下，让人知道这一轮它按什么理解去做的。 */
      if (d.intent_label) PF.$("#c-skill-hint").textContent = "已按「" + d.intent_label + "」处理";
      ROUNDS[CURRENT] = {
        q: q, a: d.answer, refs: (d.data || {}).refs || [], data: d.data || {},
        intent: d.intent, intent_label: d.intent_label, engine: d.engine,
        at: new Date().toISOString(), qa: d, rag: d.rag || null, synth: d.synth || null,
      };
      sess.current = d.session_id || sess.current;
      await sess.refresh();
      paintRound(CURRENT);
    } catch (e) {
      ROUNDS[CURRENT].a = "处理失败：" + e.message;
      paintRound(CURRENT);
    } finally {
      PF.busy(btn, false);
    }
  }

  async function loadHistory(sid) {
    try {
      const d = await PF.get(API_BASE + "/history?limit=60" +
        (sid ? "&session_id=" + encodeURIComponent(sid) : ""));
      ROUNDS = groupRounds(PF.arr(d.messages));
      CURRENT = ROUNDS.length ? ROUNDS.length - 1 : -1;
    } catch (e) {
      ROUNDS = []; CURRENT = -1;
    }
    paintRound(CURRENT);
  }

  PF.$("#btn-send").addEventListener("click", send);
  PF.$("#c-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });

  PF.$("#btn-clear").addEventListener("click", async function () {
    const sid = sess.current;
    const yes = await PF.confirm({
      title: sid ? "清空本次对话" : "清空全部对话",
      text: sid ? "只删当前这一次对话，其他对话保留。" : "会删除全部 Copilot 对话历史，不可恢复。",
      okText: "清空", danger: true,
    });
    if (!yes) return;
    try { await PF.post(API_BASE + "/clear", { session_id: sid }); } catch (e) { /* 已提示 */ }
    ROUNDS = []; CURRENT = -1;
    await sess.refresh();
    paintRound(-1);
    PF.toast("对话已清空", "ok");
  });

  await sess.refresh();
  await loadHistory(sess.current);
})();
</script>
</body>
</html>
