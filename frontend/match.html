<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>师生匹配 · 寻径教育 PathFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82a0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css?v=29">
<script>/* 主题引导：抢在首帧之前定下明暗，否则会先亮一帧白再变暗。
   刻意不依赖任何外部文件与 window.PF。用户在顶栏选过则以 localStorage 为准，
   没选过就跟随系统 prefers-color-scheme。 */
(function(){var t=null;try{t=localStorage.getItem("pf_theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
  .mk-list { display: flex; flex-direction: column; gap: var(--s-3); }
  .res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: var(--s-4); }
  @media (max-width: 700px) { .res-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/js/common.js?v=14"></script>
<script src="/static/js/tabs.js"></script>
<script>
(async function () {
  const PF = window.PF;

  const me = await PF.requireAuth("");
  if (!me) return;
  const isTeacher = me.role === "teacher";
  const myName = me.name || "";

  const view = PF.shell({
    active: "match",
    me: me,
    title: isTeacher ? "师生匹配" : "团队匹配",
    desc: isTeacher
      ? "两件事都在这里：一是长期团队 —— 按匹配分排序的推荐候选，双方都确认才算匹配成功；二是招募公告 —— 发布资源、处理学生申请，通过后自动给该生建一条跟进任务。" +
        "匹配分 = 方向契合 60 分 + 层次适配 20 分 + 兴趣新鲜度 10 分 + 名额余量 10 分，规则固定、理由可复核。"
      : "系统按方向契合度、层次适配、兴趣新鲜度与名额余量给你排了序。你表态后老师那边也会给出意向，双方都确认才算匹配成功。",
    wide: true,
    // 手机上把页头主操作贴底：教师侧四个标签内容都长，滚下去不该再让人滚回页头找按钮
    dock: isTeacher,
    actions: '<button class="btn" id="btn-refresh">' + PF.icon("refresh", 15) + "刷新</button>" +
      (isTeacher
        ? '<button class="btn btn--primary" id="btn-new-group">' + PF.icon("plus", 15) + "新建团队</button>"
        : ""),
  });

  view.innerHTML = '<div id="tabs-host"></div>';
  const host = PF.$("#tabs-host", view);

  /* 两个数据源的缓存。必须声明在 PF.tabs() 之前：构造时会同步渲染首屏标签，
     而深链（如 /match#/tab=res）可能直接落在资源标签上 —— 声明晚了会撞 TDZ。 */
  let TD = null;                 // /api/match/recommend
  let RD = null;                 // /api/resources（资源管理 / 申请处理两个标签共用）

  /** 深链：/match#/tab=res 要能直接落到「资源管理」（旧「资源管理」页和 Copilot 演示都这么链过来）。
      PF.tabs 默认让 initial 优先于 hash，所以这里自己先读一次 hash 再决定 initial。 */
  function hashTab() {
    const m = /(?:^|&)tab=([^&]+)/.exec((location.hash || "").replace(/^#\/?/, ""));
    return m ? decodeURIComponent(m[1]) : "";
  }

  const tabs = PF.tabs(host, isTeacher
    ? [
        { key: "pick", label: "推荐候选", icon: "users", render: function (b) { return renderPick(b, false); } },
        { key: "groups", label: "团队管理", icon: "layers", render: renderGroups },
        { key: "res", label: "资源管理", icon: "folder", render: renderResources },
        { key: "apps", label: "申请处理", icon: "clipboard", render: renderApps },
      ]
    : [
        { key: "rec", label: "推荐团队", icon: "target", render: renderRec },
        { key: "mine", label: "我的匹配记录", icon: "check", render: renderMine },
      ], { base: "#/", initial: hashTab() || (isTeacher ? "pick" : "rec") });

  /* ============================================================ 共用渲染件 */
  function statCard(icon, label, num, hint, tone) {
    return '<div class="stat">' +
      '<div class="stat__ico' + (tone ? " stat__ico--" + tone : "") + '">' + PF.icon(icon, 18) + "</div>" +
      '<div class="flex-1"><div class="stat__num">' + num + "</div>" +
      '<div class="stat__label">' + PF.esc(label) + "</div>" +
      (hint ? '<div class="t-xs">' + PF.esc(hint) + "</div>" : "") + "</div></div>";
  }

  /** 后端把学生姓名写在理由开头，卡片上已单独显示姓名，这里去掉重复前缀。 */
  function stripName(reason, name) {
    const r = String(reason || "");
    const n = String(name || "").trim();
    if (n && r.indexOf(n + "：") === 0) return r.slice(n.length + 1);
    return r;
  }

  function intentBadge(label, action) {
    const map = { accepted: ["badge--ok", "已确认"], declined: ["badge--danger", "已婉拒"] };
    const m = map[String(action || "")] || ["badge--info", "未表态"];
    return '<span class="badge ' + m[0] + '">' + PF.esc(label + m[1]) + "</span>";
  }

  function isMatched(item) {
    return item.teacher_action === "accepted" && item.student_action === "accepted";
  }

  function seatsBadge(group) {
    const cap = Number(group.capacity) || 0;
    if (!cap) return '<span class="badge badge--info">名额不限</span>';
    const left = Math.max(0, Number(group.seats_left) || 0);
    if (left <= 0) return '<span class="badge badge--danger">名额已满（' + cap + " 人）</span>";
    if (left === 1) return '<span class="badge badge--warn">仅剩 1 个名额</span>';
    return '<span class="badge">剩余 ' + left + " / " + cap + " 个名额</span>";
  }

  function dirChips(dirs, emptyText) {
    const list = PF.arr(dirs);
    if (!list.length) return '<span class="t-xs t-dim">' + PF.esc(emptyText || "未填写方向") + "</span>";
    return list.map(function (d) { return '<span class="chip">' + PF.esc(d) + "</span>"; }).join(" ");
  }

  /** 匹配度分档配色（用户 2026-09-20 定）：≥70 绿 / 50-70 黄 / 40-50 橙 / 20-40 紫 / <20 红。
     返回值同时用作 progress__bar--X 与 mk-score--X / mk-pct--X 的档位后缀。 */
  function scoreTone(score) {
    const s = Number(score) || 0;
    if (s >= 70) return "ok";
    if (s >= 50) return "yellow";
    if (s >= 40) return "orange";
    if (s >= 20) return "vivid";
    return "danger";
  }

  function scorePill(score) {
    const tone = scoreTone(score);
    return '<div class="mk-score mk-score--' + tone + '">' +
      '<div class="mk-score__n">' + PF.num(score, 1) + "</div>" +
      '<div class="mk-score__u">匹配分 / 100</div></div>';
  }

  const SCORE_CAVEAT =
    "匹配分只由四项相加得出：方向契合 60 分、层次适配 20 分、兴趣新鲜度 10 分、名额余量 10 分。" +
    "层次只用来判断「这个组的难度合不合适」，不是能力评定，也不用于分班、不构成准入门槛。";

  /* ============================================================ 教师侧 */
  let curGroup = 0;

  async function renderPick(box, quiet) {
    if (!quiet) box.innerHTML = PF.loading("正在计算匹配分");
    let d;
    try {
      TD = await PF.get("/api/match/recommend");
      d = TD;
    } catch (e) {
      box.innerHTML = PF.empty({
        icon: "layers",
        title: "还没有团队可推荐",
        desc: e.message + "。团队方向是打分的基准，先建一个，学生那边也会立刻收到推荐。",
        action: '<button class="btn btn--primary" id="btn-nogroup">' + PF.icon("plus", 15) + "新建团队</button>",
      });
      const b = PF.$("#btn-nogroup", box);
      if (b) b.addEventListener("click", function () { newGroupModal(); });
      return;
    }

    const groups = PF.arr(d.groups);
    if (!groups.length) {
      box.innerHTML = PF.empty({
        icon: "layers", title: "还没有团队",
        desc: "先建一个团队（课题组 / 横向项目 / 竞赛队都行），再来这里看推荐候选。",
        action: '<button class="btn btn--primary" id="btn-nogroup2">' + PF.icon("plus", 15) + "新建团队</button>",
      });
      const b = PF.$("#btn-nogroup2", box);
      if (b) b.addEventListener("click", function () { newGroupModal(); });
      return;
    }

    if (!groups.filter(function (g) { return g.group_id === curGroup; }).length) {
      curGroup = groups[0].group_id;
    }
    const cur = groups.filter(function (g) { return g.group_id === curGroup; })[0];

    const seen = {};
    let matchedPairs = 0, studentWaiting = 0, teacherWaiting = 0;
    groups.forEach(function (g) {
      PF.arr(g.candidates).forEach(function (c) {
        seen[c.student_id] = true;
        const t = c.teacher_action === "accepted", s = c.student_action === "accepted";
        if (t && s) matchedPairs++;
        if (s && !t) studentWaiting++;
        if (t && !s) teacherWaiting++;
      });
    });

    const stats =
      '<div class="grid grid-4">' +
        statCard("layers", "我的团队", PF.num(groups.length, 0) + ' <span class="t-sm">个</span>',
          d.class_id ? "候选范围：行政班 " + d.class_id : "候选范围：全部学生", "") +
        statCard("users", "候选学生", PF.num(Object.keys(seen).length, 0) + ' <span class="t-sm">人</span>',
          "跨全部团队去重", "info") +
        statCard("bell", "学生已表态 · 待我确认", PF.num(studentWaiting, 0) + ' <span class="t-sm">条</span>',
          "学生点了愿意加入", studentWaiting > 0 ? "warn" : "") +
        statCard("check", "已确认匹配", PF.num(matchedPairs, 0) + ' <span class="t-sm">对</span>',
          teacherWaiting > 0 ? "另有 " + teacherWaiting + " 条等我等学生表态" : "双方都确认才计入", "ok") +
      "</div>";

    box.innerHTML = stats +
      '<div class="split mt-5">' +
        '<aside class="split__aside"><div class="card">' +
          '<div class="card__head"><h3>' + PF.icon("layers", 15) + " 团队</h3>" +
            '<div class="card__head-actions"><span class="t-xs t-dim">共 ' + groups.length + " 个</span></div></div>" +
          '<div class="card__body card__body--tight"><div class="pick-list">' +
            groups.map(function (g) {
              const cap = Number(g.capacity) || 0;
              return '<button class="pick' + (g.group_id === curGroup ? " is-active" : "") +
                  '" data-g="' + g.group_id + '">' +
                '<div class="pick__name">' + PF.esc(g.name || "") + "</div>" +
                '<div class="pick__meta">' + PF.arr(g.directions).length + " 个方向 · " +
                  (cap ? "剩余 " + PF.num(g.seats_left, 0) + "/" + cap : "名额不限") + " · " +
                  PF.arr(g.candidates).length + " 名候选</div>" +
              "</button>";
            }).join("") +
          "</div></div>" +
        "</div></aside>" +

        '<div class="stack">' +
          '<div class="card"><div class="card__head">' +
            "<h3>" + PF.icon("target", 15) + " " + PF.esc(cur.name || "") + "</h3>" +
            '<div class="card__head-actions">' + seatsBadge(cur) +
              '<button class="btn btn--sm" data-eg="' + cur.group_id + '">' +
                PF.icon("edit", 12) + "编辑本组</button>" +
            "</div></div>" +
            '<div class="card__body">' +
              '<div class="mk-chips">' + dirChips(cur.directions, "未填写研究方向") + "</div>" +
              (cur.requirement
                ? '<div class="t-sm mt-3" style="line-height:1.8"><b>招募要求：</b>' + PF.esc(cur.requirement) + "</div>"
                : "") +
              '<div class="mt-3">' + PF.caveat(SCORE_CAVEAT) + "</div>" +
            "</div>" +
          "</div>" +
          candidateList(cur) +
        "</div>" +
      "</div>";

    PF.$$("[data-g]", box).forEach(function (b) {
      b.addEventListener("click", function () {
        curGroup = Number(b.dataset.g);
        renderPick(box, true);
      });
    });
    PF.$$("[data-eg]", box).forEach(function (b) {
      b.addEventListener("click", function () { editGroupModal(cur); });
    });
    PF.$$("[data-act]", box).forEach(function (b) {
      b.addEventListener("click", async function () {
        PF.busy(b, true);
        try {
          const r = await PF.post("/api/match/decide", {
            group_id: curGroup,
            student_id: Number(b.dataset.s),
            action: b.dataset.act,
          });
          PF.toast(r.message || "已记录", r.matched ? "ok" : "");
          if (r.matched && r.task_created) PF.toast("已为该生自动创建跟进任务", "ok");
          await renderPick(box, true);
        } catch (e) {
          PF.busy(b, false);
        }
      });
    });
  }

  function candidateList(group) {
    const list = PF.arr(group.candidates);
    if (!list.length) {
      return '<div class="card"><div class="card__body">' + PF.empty({
        icon: "users",
        title: "这个组还没有可推荐的学生",
        desc: "打分范围是本班的在读学生；换个团队看看，或先确认学生画像已经生成。",
      }) + "</div></div>";
    }

    const matchedN = list.filter(isMatched).length;
    return '<div class="card"><div class="card__head">' +
        "<h3>" + PF.icon("users", 15) + " 推荐候选</h3>" +
        '<div class="card__head-actions"><span class="t-xs t-dim">按匹配分排序 · 共 ' +
          list.length + " 名" + (matchedN ? " · 已匹配 " + matchedN + " 名" : "") + "</span></div></div>" +
      '<div class="card__body"><div class="mk-list">' + list.map(function (c) {
        const matched = isMatched(c);
        return '<div class="mk-card' + (matched ? " mk-card--match" : "") + '">' +
          '<div class="mk-card__head">' +
            '<div class="mk-ava" aria-hidden="true">' + PF.esc(PF.initial(c.name)) + "</div>" +
            '<div class="flex-1">' +
              '<div class="mk-name">' + PF.esc(c.name || "") + " " + PF.trackBadge(c.track) +
                " " + PF.levelTag(c.grade_level, true) + "</div>" +
              '<div class="mk-sub">' + PF.esc(c.username || "") +
                (c.gpa === null || c.gpa === undefined ? "" : " · GPA " + PF.num(c.gpa, 2)) + "</div>" +
            "</div>" +
            scorePill(c.score) +
          "</div>" +
          '<div class="mk-card__body">' +
            '<div class="mk-chips">' + dirChips(c.interests, "未填写兴趣方向") + "</div>" +
            '<div class="mk-bar mt-3"><span>匹配度</span>' +
              PF.progress(c.score, { tone: scoreTone(c.score) }) +
              '<span class="mk-pct mk-pct--' + scoreTone(c.score) + '">' + PF.num(c.score, 0) + "%</span></div>" +
            '<p class="mk-reason">' + PF.esc(stripName(c.reason, c.name)) + "</p>" +
          "</div>" +
          '<div class="mk-card__foot">' +
            intentBadge("我：", c.teacher_action) +
            intentBadge("学生：", c.student_action) +
            (matched ? '<span class="badge badge--ok">' + PF.icon("check", 11) + " 匹配成功</span>" : "") +
            PF.engineBadge(c.engine || "rule") +
            '<div class="spacer"></div>' +
            (matched
              ? '<span class="mk-foot-note">已生成跟进任务，可在「作业管理」里看到该生的待办</span>'
              : '<button class="btn btn--sm' + (c.teacher_action === "accepted" ? "" : " btn--primary") +
                  '" data-act="accepted" data-s="' + c.student_id + '">' + PF.icon("check", 12) + "同意</button>" +
                '<button class="btn btn--sm' + (c.teacher_action === "declined" ? " btn--danger" : "") +
                  '" data-act="declined" data-s="' + c.student_id + '">' + PF.icon("x", 12) + "婉拒</button>") +
          "</div>" +
        "</div>";
      }).join("") + "</div></div></div>";
  }

  function groupForm(g) {
    const dirs = PF.arr(g && g.directions).join("、");
    const kind = String((g && g.kind) || "").trim() || "科研课题组";
    return '<div class="stack-sm">' +
      '<label class="t-sm t-strong">团队名称</label>' +
      '<input class="input" id="g-name" maxlength="60" placeholder="如：多模态内容理解课题组 / 竞赛队 / 校企合作项目组" value="' +
        PF.esc(g ? g.name : "") + '">' +
      '<label class="t-sm t-strong mt-2">团队类型</label>' +
      '<select class="select" id="g-kind">' +
        PF.GROUP_KINDS.map((k) => '<option value="' + PF.esc(k) + '"' +
          (k === kind ? " selected" : "") + ">" + PF.esc(k) + "</option>").join("") +
      "</select>" +
      '<label class="t-sm t-strong mt-2">方向（多个用顿号或逗号分隔）</label>' +
      '<input class="input" id="g-dirs" placeholder="如：多模态、CV、LLM" value="' + PF.esc(dirs) + '">' +
      '<label class="t-sm t-strong mt-2">招募要求</label>' +
      '<textarea class="input" id="g-req" rows="3" placeholder="如：熟悉 PyTorch 基础，能读英文论文；每周可投入 6 小时以上">' +
        PF.esc(g ? (g.requirement || "") : "") + "</textarea>" +
      '<label class="t-sm t-strong mt-2">名额上限（0 表示不限）</label>' +
      '<input class="input" type="number" id="g-cap" min="0" max="50" value="' +
        (g ? PF.num(g.capacity, 0) : 3) + '">' +
      PF.caveat("类型只用于分类查看（科研 / 横向 / 竞赛 / 实习），不参与打分；" +
        "方向才是打分的基准 —— 方向契合度占匹配分的 60%，学生兴趣方向与团队方向有交集才拿得到分。") +
      "</div>";
  }

  function groupFormValues() {
    return {
      name: PF.$("#g-name").value.trim(),
      kind: PF.$("#g-kind").value,
      directions: PF.$("#g-dirs").value.trim(),
      requirement: PF.$("#g-req").value.trim(),
      capacity: Number(PF.$("#g-cap").value) || 0,
    };
  }

  function newGroupModal() {
    PF.modal({
      title: "新建团队",
      body: groupForm(null),
      actions: [
        { label: "取消" },
        { label: "创建", type: "primary", onClick: async function () {
            const values = groupFormValues();
            if (!values.name) { PF.toast("请填写团队名称", "warn"); return true; }
            if (!values.directions) { PF.toast("请至少填写一个研究方向", "warn"); return true; }
            try {
              const r = await PF.post("/api/teacher/groups", values);
              curGroup = Number((r && r.group_id) || 0) || curGroup;
              PF.toast("团队已创建", "ok");
              tabs.reload();
            } catch (e) { return true; }
          } },
      ],
    });
  }

  function editGroupModal(group) {
    if (!group) return;
    PF.modal({
      title: "编辑团队：" + PF.trunc(group.name, 18),
      body: groupForm(group),
      actions: [
        { label: "取消" },
        { label: "保存", type: "primary", onClick: async function () {
            const values = groupFormValues();
            if (!values.name) { PF.toast("请填写团队名称", "warn"); return true; }
            if (!values.directions) { PF.toast("请至少填写一个研究方向", "warn"); return true; }
            try {
              await PF.post("/api/teacher/groups/" + group.group_id, values);
              PF.toast("已保存", "ok");
              tabs.reload();
            } catch (e) { return true; }
          } },
      ],
    });
  }

  async function renderGroups(box) {
    box.innerHTML = PF.loading("正在读取团队");
    let groups = [];
    try {
      const d = await PF.get("/api/teacher/groups");
      groups = PF.arr(d.groups);
    } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }

    const matched = [];
    groups.forEach(function (g) {
      PF.arr(g.candidates).forEach(function (c) {
        if (isMatched(c)) {
          matched.push({
            name: c.name, username: c.username, track: c.track, grade_level: c.grade_level,
            group: g.name, score: c.score,
          });
        }
      });
    });

    box.innerHTML =
      '<div class="card"><div class="card__head">' +
        "<h3>" + PF.icon("layers", 15) + " 我的团队</h3>" +
        '<div class="card__head-actions">' +
          '<button class="btn btn--sm btn--primary" id="g-new">' + PF.icon("plus", 12) + "新建</button>" +
        "</div></div>" +
        '<div class="card__body">' +
          PF.caveat("「我的团队」是长期招生、支撑推荐打分的主体，科研课题组、横向项目、竞赛团队、实习组都建在这里；" +
            "本页「资源管理」里的招募公告是一次性的报名通知，两者相互独立。") +
          (groups.length

                icon: "layers", title: "还没有团队",
                desc: "先建一个，学生那边就能收到推荐。方向与名额上限会直接决定推荐排序，类型只影响分类展示。",
                action: '<button class="btn btn--primary" id="g-new2">' + PF.icon("plus", 15) + "新建团队</button>",
              }) + "</div>") +

        '<div class="card__body card__body--flush">' +

            { key: "username", label: "账号", cls: "nowrap t-mono" },

          okText: "删除", danger: true,

    if (b2) b2.addEventListener("click", function () { newGroupModal(); });

      '<div class="mk-card__head" style="border-bottom:none;padding-bottom:0">' +
        '<div class="flex-1"><div class="mk-name">' + PF.esc(g.name || "") + " " + PF.kindBadge(g.kind) + "</div>" +
          '<div class="mk-sub">' + (Number(g.capacity) ? PF.num(g.capacity, 0) + " 个名额上限" : "不设名额上限") + "</div></div>" +
        seatsBadge(g) +
      "</div>" +
      '<div class="mk-card__body">' +
        '<div class="mk-chips">' + dirChips(g.directions, "未填写研究方向") + "</div>" +

          ? '<div class="t-xs mt-3" style="line-height:1.75;color:var(--ink-600)">' + PF.esc(g.requirement) + "</div>"

  /* ============================================================ 教师侧：资源与申请
     原「资源管理」页已并入本页（2026-09-21）：招募公告（一次性报名）与常设团队（双向匹配）
     是两套东西，但都是「老师找学生」这一件事，放在同一页的两个标签里，省掉来回跳页。
     RD 声明在文件前部：深链 /match#/tab=res 会同步渲染本标签，晚声明会撞上 TDZ。 */

  const RES_CAVEAT =
    "这里的「资源」是面向学生的一次性招募公告（课题组 / 比赛 / 实习 / 项目）：学生主动申请、你来批复，" +
    "通过后自动给该生建一条跟进任务。「团队管理」里的常设团队是双向匹配的打分主体，两者相互独立 —— " +
    "发布课题组类资源不会自动创建团队。";

  async function loadRes(force) {
    if (RD && !force) return RD;
    RD = await PF.get("/api/resources");
    return RD;
  }

  /* ---- 标签三：资源管理 ---- */
  async function renderResources(box) {
    box.innerHTML = PF.loading("正在读取我发布的资源");
    let d;
    try { d = await loadRes(true); } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }
    const list = PF.arr(d.resources);
    const s = d.stats || {};

    const stats =
      '<div class="grid grid-4">' +
        statCard("folder", "我发布的资源", PF.num(s.total, 0) + ' <span class="t-sm">条</span>',
          "四类：课题组 / 比赛 / 实习 / 项目", "") +
        statCard("play", "接收申请中", PF.num(s.open, 0) + ' <span class="t-sm">条</span>', "状态为 open", "info") +
        statCard("bell", "待处理申请", PF.num(s.pending, 0) + ' <span class="t-sm">条</span>',
          "学生已提交，等你答复", (s.pending || 0) > 0 ? "warn" : "") +
        statCard("check", "已通过申请", PF.num(s.accepted, 0) + ' <span class="t-sm">人</span>',
          "通过时自动生成跟进任务", "ok") +
      "</div>";

    const head =
      '<div class="row mt-4" style="gap:10px;flex-wrap:wrap">' +
        '<button class="btn btn--primary" id="btn-pub">' + PF.icon("plus", 15) + "发布资源</button>" +
        '<span class="t-xs t-dim">发布后学生能在「资源广场」看到并申请。</span>' +
      "</div>" +
      '<div class="mt-3">' + PF.caveat(RES_CAVEAT) + "</div>";

    if (!list.length) {
      box.innerHTML = stats + head + '<div class="mt-5">' + PF.empty({
        icon: "folder",
        title: "你还没有发布任何资源",
        desc: "资源可以是常设课题组、学科竞赛、实习岗位或横向项目。发布后学生能在「资源广场」看到并申请。",
        action: '<button class="btn btn--primary" id="btn-go-publish">' + PF.icon("plus", 15) + "去发布</button>",
      }) + "</div>";
      const bp = PF.$("#btn-pub", box), bg = PF.$("#btn-go-publish", box);
      if (bp) bp.addEventListener("click", function () { publishModal(); });
      if (bg) bg.addEventListener("click", function () { publishModal(); });
      return;
    }

    box.innerHTML = stats + head + '<div class="res-grid mt-4">' + list.map(resCardHtml).join("") + "</div>";

    PF.$$("[data-close]", box).forEach(function (b) {
      b.addEventListener("click", async function () {
        try {
          await PF.post("/api/teacher/resources/" + b.dataset.close + "/close");
          PF.toast("状态已切换", "ok");
          renderResources(box);
        } catch (e) { /* 已提示 */ }
      });
    });
    PF.$$("[data-del]", box).forEach(function (b) {
      b.addEventListener("click", async function () {
        const yes = await PF.confirm({
          title: "删除资源",
          text: "会同时删除该资源下所有学生申请记录，不可恢复。",
          okText: "删除", danger: true,
        });
        if (!yes) return;
        try {
          await PF.del("/api/teacher/resources/" + b.dataset.del);
          PF.toast("已删除", "ok");
          RD = null;
          renderResources(box);
        } catch (e) { /* 已提示 */ }
      });
    });
    PF.$$("[data-edit]", box).forEach(function (b) {
      b.addEventListener("click", function () {
        const r = list.filter(function (x) { return x.id === Number(b.dataset.edit); })[0];
        editResModal(r);
      });
    });
    PF.$$("[data-decide]", box).forEach(function (b) {
      b.addEventListener("click", function () {
        const r = list.filter(function (x) { return x.id === Number(b.dataset.res); })[0];
        const app = PF.arr(r && r.applications).filter(function (a) { return a.id === Number(b.dataset.decide); })[0];
        decideModal(Object.assign({}, app, { resource_title: r.title }));
      });
    });
    const bp2 = PF.$("#btn-pub", box);
    if (bp2) bp2.addEventListener("click", function () { publishModal(); });
  }

        '<button class="btn btn--sm" data-edit="' + r.id + '">' + PF.icon("edit", 12) + "编辑</button>" +
        '<div class="spacer"></div>' +
        '<button class="btn btn--sm btn--danger" data-del="' + r.id + '">' + PF.icon("trash", 12) + "</button>" +

  /* ---- 标签四：申请处理 ---- */
  function decideModal(app) {
    if (!app) return;
    PF.modal({
      title: "处理申请",
      width: "narrow",
      body:
        '<div class="stack-sm">' +
          '<div class="row" style="gap:8px">' +
            '<span class="t-strong">' + PF.esc(app.student_name || app.student_username) + "</span>" +
            (app.track ? PF.trackBadge(app.track) : "") +
            (app.grade_level ? PF.levelTag(app.grade_level, true) : "") +
          "</div>" +
          '<div class="t-xs t-dim">申请：' + PF.esc(app.resource_title || "") + "</div>" +
          (app.message
            ? '<div class="t-sm" style="line-height:1.75;color:var(--ink-700)">学生留言：' +
              PF.esc(app.message) + "</div>"
            : '<div class="t-xs t-dim">学生没有留额外说明。</div>') +
          '<label class="t-sm t-strong mt-2">回复（可留空）</label>' +
          '<textarea class="input" id="d-reply" rows="3" placeholder="如：周五下午三点来实验室聊聊"></textarea>' +
          '<div class="t-xs t-dim">通过后会自动给该生建一条跟进任务。</div>' +
        "</div>",
      actions: [
        { label: "取消" },
        { label: "婉拒", type: "danger", onClick: async function () { await sendDecide(app, "declined"); } },
        { label: "通过", type: "primary", onClick: async function () { await sendDecide(app, "accepted"); } },
      ],
    });
  }

  async function sendDecide(app, action) {
    const reply = (PF.$("#d-reply") && PF.$("#d-reply").value.trim()) || "";
    try {
      const d = await PF.post("/api/teacher/applications/" + app.id + "/decide", { action: action, reply: reply });
      PF.toast(action === "accepted"
        ? (d.task_created ? "已通过，并给该生建了跟进任务" : "已通过")
        : "已婉拒", "ok");
      RD = null;
      tabs.reload();     // 卡片列表与申请表格都要跟着变，重跑当前标签最省事
    } catch (e) { return true; }
  }

  async function renderApps(box) {
    box.innerHTML = PF.loading("正在汇总学生申请");
    let d;
    try { d = await loadRes(true); } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }

    let FILTER = "pending";
    const all = [];
    PF.arr(d.resources).forEach(function (r) {
      PF.arr(r.applications).forEach(function (a) {
        all.push(Object.assign({}, a, { resource_title: r.title, rtype_label: r.rtype_label, resource_id: r.id }));
      });
    });
    all.sort(function (a, b) {
      const rank = { pending: 0, accepted: 1, declined: 2 };
      return (rank[a.status] || 3) - (rank[b.status] || 3) || (b.id - a.id);
    });

    const pendingCount = all.filter(function (a) { return a.status === "pending"; }).length;

    box.innerHTML =
      '<div class="card"><div class="card__head">' +
        "<h3>" + PF.icon("clipboard", 15) + " 学生申请</h3>" +
        '<div class="card__head-actions">' +
          '<button class="btn btn--sm" data-f="pending">待处理 ' + pendingCount + "</button>" +
          '<button class="btn btn--sm" data-f="all">全部 ' + all.length + "</button>" +
        "</div>" +
      "</div>" +
      '<div class="card__body card__body--flush" id="apps-body"></div>' +
      '<div class="card__foot"><span class="t-xs t-dim">' +
        "「通过」会自动给该生建一条跟进任务（类型为资源跟进），学生能在「我的画像 → 我的任务」里看到。" +
      "</span></div></div>";

    function paint() {
      const rows = FILTER === "all" ? all : all.filter(function (a) { return a.status === "pending"; });
      PF.$("#apps-body", box).innerHTML = PF.table([
        { key: "student_name", label: "学生", render: function (a) {
            return '<div class="t-strong">' + PF.esc(a.student_name || a.student_username) + "</div>" +
              '<div class="t-xs t-dim">' + PF.esc(a.student_username || "") +
              (a.class_name ? " · " + PF.esc(a.class_name) : "") + "</div>";
          } },
        { key: "profile", label: "画像", render: function (a) {
            return '<div class="row" style="gap:5px">' +
              (a.track ? PF.trackBadge(a.track) : "") +
              (a.grade_level ? PF.levelTag(a.grade_level, true) : "") +
              (a.gpa !== null && a.gpa !== undefined ? '<span class="t-xs">绩点 ' + PF.num(a.gpa, 2) + "</span>" : "") +
              "</div>";
          } },
        { key: "resource_title", label: "申请的资源", render: function (a) {
            return '<span class="badge badge--brand">' + PF.esc(a.rtype_label || "") + "</span> " +
              '<span class="t-sm">' + PF.esc(PF.trunc(a.resource_title, 22)) + "</span>";
          } },
        { key: "message", label: "留言", render: function (a) {
            return a.message
              ? '<span class="t-sm">' + PF.esc(PF.trunc(a.message, 40)) + "</span>"
              : '<span class="t-dim t-sm">—</span>';
          } },
        { key: "status_text", label: "状态", render: function (a) {
            return PF.statusBadge(a.status_text || "") +
              (a.teacher_reply ? '<div class="t-xs t-dim mt-2">' + PF.esc(PF.trunc(a.teacher_reply, 30)) + "</div>" : "");
          } },
        { key: "ops", label: "操作", cls: "nowrap", render: function (a) {
            if (a.status !== "pending") return '<span class="t-dim t-xs">已处理</span>';
            return '<div class="row" style="gap:6px">' +
              '<button class="btn btn--sm btn--primary" data-ok="' + a.id + '">通过</button>' +
              '<button class="btn btn--sm" data-no="' + a.id + '">婉拒</button></div>';
          } },
      ], rows, {
        empty: {
          icon: FILTER === "pending" ? "check" : "clipboard",
          title: FILTER === "pending" ? "没有待处理的申请" : "还没有任何申请",
          desc: "学生提交申请后会出现在这里。已通过会自动给该生建跟进任务。",
        },
      });

      PF.$$("[data-ok], [data-no]", box).forEach(function (b) {
        b.addEventListener("click", function () {
          const id = Number(b.dataset.ok || b.dataset.no);
          const app = all.filter(function (a) { return a.id === id; })[0];
          decideModal(app);
        });
      });
    }

    PF.$$("[data-f]", box).forEach(function (b) {
      b.addEventListener("click", function () { FILTER = b.dataset.f; paint(); });
    });
    paint();
  }

  /* ============================================================ 学生侧 */
  let SD = null;

  async function renderRec(box) {
    box.innerHTML = PF.loading("正在计算推荐团队");
    let d;
    try {
      SD = await PF.get("/api/match/recommend");
      d = SD;
    } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }

    const p = d.profile || {};
    const list = PF.arr(d.matches);
    const interests = PF.arr(p.interests);
    const waiting = list.filter(function (c) {
      return c.student_action === "accepted" && c.teacher_action !== "accepted";
    }).length;

    const stats =
      '<div class="grid grid-4">' +
        statCard("target", "推荐团队", PF.num(list.length, 0) + ' <span class="t-sm">个</span>',
          "按匹配分从高到低，只列前 5 个", "") +
        statCard("check", "已确认匹配", PF.num(d.confirmed, 0) + ' <span class="t-sm">个</span>',
          "双方都确认才计入", Number(d.confirmed) > 0 ? "ok" : "") +
        statCard("clock", "等老师确认", PF.num(waiting, 0) + ' <span class="t-sm">个</span>',
          "你已经表态同意", waiting > 0 ? "warn" : "") +
        statCard("star", "我的兴趣方向", PF.num(interests.length, 0) + ' <span class="t-sm">个</span>',
          "在「我的画像」里可以调整", "info") +
      "</div>";

    box.innerHTML = stats +
      '<div class="grid grid-3-2 mt-5" style="gap:16px">' +        '<div>' + (list.length
          ? '<div class="mk-list">' + list.map(studentCard).join("") + "</div>"
          : PF.empty({
              icon: "target", title: "暂时没有推荐的团队",
              desc: "推荐需要团队方向与你的兴趣方向有交集。先把「我的画像」里的兴趣方向补全，再回来看。",
              action: '<a class="btn btn--primary" href="/student">' + PF.icon("compass", 15) + "去完善画像</a>",
            })) + "</div>" +

        '<div class="stack">' +
          '<div class="card"><div class="card__head"><h3>' + PF.icon("compass", 15) + " 我的画像口径</h3></div>" +
            '<div class="card__body">' +
              '<div class="mk-chips">' + PF.trackBadge(p.track) + " " + PF.levelTag(p.grade_level, true) +
                '<span class="badge">GPA ' +
                (p.gpa === null || p.gpa === undefined ? "—" : PF.num(p.gpa, 2)) + "</span></div>" +
              '<div class="t-xs t-dim mt-3">兴趣方向</div>' +
              '<div class="mk-chips mt-2">' + dirChips(interests, "还没填兴趣方向") + "</div>" +
              '<div class="mt-3">' + PF.caveat(
                "推荐用的是你画像里的兴趣方向与层次。层次只决定「推给你多深的内容、多难的任务」，不是能力评定，也不用于分班。") + "</div>" +
              '<a class="btn btn--sm mt-3" href="/student">' + PF.icon("edit", 12) + "去调整画像</a>" +
            "</div></div>" +

          '<div class="card"><div class="card__head"><h3>' + PF.icon("info", 15) + " 匹配分怎么来的</h3></div>" +
            '<div class="card__body">' +
              '<ol class="obj-list">' +
                "<li>方向契合 60 分：你的兴趣方向与团队方向的交集占比。</li>" +
                "<li>层次适配 20 分：组里要求「有科研基础」而你层次偏下时会扣分，入门友好的组会加分。</li>" +
                "<li>兴趣新鲜度 10 分：你没涉猎过的研究类方向会适当加分，鼓励探索。</li>" +
                "<li>名额余量 10 分：已满的组会被压到很低，避免推一个进不去的组。</li>" +
              "</ol>" +
              '<div class="mt-3">' + PF.caveat("这套规则是固定的，每张卡片下面都能看到它给你的具体理由，可以逐条核对。") + "</div>" +
            "</div></div>" +
        "</div>" +
      "</div>";

    PF.$$("[data-act]", box).forEach(function (b) {
      b.addEventListener("click", async function () {
        PF.busy(b, true);
        try {
          const r = await PF.post("/api/match/decide", {
            group_id: Number(b.dataset.g),
            action: b.dataset.act,
          });
          PF.toast(r.message || "已记录", r.matched ? "ok" : "");
          await renderRec(box);
        } catch (e) {
          PF.busy(b, false);
        }
      });
    });
  }

  function studentButtons(c) {
    const act = String(c.student_action || "pending");
    if (isMatched(c)) {
      return '<span class="mk-foot-note">' + PF.icon("check", 12) +
        " 匹配成功，等老师联系你安排第一次组会</span>";
    }
    if (act === "accepted") {
      return '<button class="btn btn--sm" data-g="' + c.group_id + '" data-act="declined">' +
        PF.icon("x", 12) + "撤回意向</button>";
    }
    if (act === "declined") {
      return '<button class="btn btn--sm btn--primary" data-g="' + c.group_id + '" data-act="accepted">' +
        PF.icon("refresh", 12) + "重新考虑</button>";
    }
    return '<button class="btn btn--sm btn--primary" data-g="' + c.group_id + '" data-act="accepted">' +
        PF.icon("check", 12) + "愿意加入</button>" +
      '<button class="btn btn--sm" data-g="' + c.group_id + '" data-act="declined">' +
        PF.icon("x", 12) + "暂不考虑</button>";
  }

  function studentCard(c) {
    const matched = isMatched(c);
    return '<div class="mk-card' + (matched ? " mk-card--match" : "") + '">' +
      '<div class="mk-card__head">' +
        '<div class="flex-1">' +
          '<div class="mk-name">' + PF.esc(c.name || "团队") + " " + PF.kindBadge(c.kind) + "</div>" +
          '<div class="mk-sub">指导教师：' + PF.esc(c.teacher_name || "—") + "</div>" +
        "</div>" +
        scorePill(c.score) +
      "</div>" +
      '<div class="mk-card__body">' +
        '<div class="mk-chips">' + dirChips(c.directions, "未填写研究方向") + "</div>" +
        (c.requirement
          ? '<div class="t-sm mt-3" style="line-height:1.8"><b>招募要求：</b>' + PF.esc(c.requirement) + "</div>"
          : "") +
        '<div class="mk-bar mt-3"><span>匹配度</span>' +
          PF.progress(c.score, { tone: scoreTone(c.score) }) +
          '<span class="mk-pct mk-pct--' + scoreTone(c.score) + '">' + PF.num(c.score, 0) + "%</span></div>" +
        '<p class="mk-reason">' + PF.esc(stripName(c.reason, myName)) + "</p>" +
      "</div>" +
      '<div class="mk-card__foot">' +
        intentBadge("我：", c.student_action) +
        intentBadge("老师：", c.teacher_action) +
        seatsBadge(c) +
        PF.engineBadge(c.engine || "rule") +
        '<div class="spacer"></div>' +
        studentButtons(c) +
      "</div></div>";

  }

  async function renderMine(box) {
    box.innerHTML = PF.loading("正在读取我的匹配记录");
    let d;
    try {
      d = await PF.get("/api/match/mine");
    } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }

    const list = PF.arr(d.matches);
    const matchedN = list.filter(isMatched).length;
    const waitingN = list.filter(function (r) {
      return r.student_action === "accepted" && r.teacher_action !== "accepted";
    }).length;
    const declinedN = list.filter(function (r) {
      return r.student_action === "declined" || r.teacher_action === "declined";
    }).length;

    const stats =
      '<div class="grid grid-4">' +
        statCard("activity", "我表过态的团队", PF.num(list.length, 0) + ' <span class="t-sm">个</span>',
          "含已确认、待确认与已婉拒", "") +
        statCard("check", "已确认匹配", PF.num(matchedN, 0) + ' <span class="t-sm">个</span>',
          "双方都确认", matchedN > 0 ? "ok" : "") +
        statCard("clock", "等老师确认", PF.num(waitingN, 0) + ' <span class="t-sm">个</span>',
          "你已经表态同意", waitingN > 0 ? "warn" : "") +
        statCard("x", "已婉拒", PF.num(declinedN, 0) + ' <span class="t-sm">个</span>',
          "任一方婉拒即不计入", "info") +
      "</div>";

    box.innerHTML = stats +
      '<div class="card mt-5"><div class="card__head">' +
        "<h3>" + PF.icon("check", 15) + " 我的匹配记录</h3>" +
        '<div class="card__head-actions"><span class="t-xs t-dim">鼠标悬停可看当时的匹配理由</span></div></div>' +
        '<div class="card__body card__body--flush">' +
          PF.table([
            { key: "group_name", label: "团队", render: function (r) {
                return "<b>" + PF.esc(r.group_name || "") + "</b>"; } },
            { key: "teacher_name", label: "指导教师", cls: "nowrap" },
            { key: "directions", label: "方向", render: function (r) { return dirChips(r.directions); } },
            { key: "score", label: "匹配分", cls: "nowrap", render: function (r) { return '<b class="mk-cell mk-cell--' + scoreTone(r.score) + '">' + PF.num(r.score, 1) + "</b>"; } },
            { key: "student_action", label: "我的意向", cls: "nowrap", render: function (r) {
                return intentBadge("", r.student_action); } },
            { key: "teacher_action", label: "老师意向", cls: "nowrap", render: function (r) {
                return intentBadge("", r.teacher_action); } },
            { key: "matched", label: "结果", cls: "nowrap", render: function (r) {
                return isMatched(r)
                  ? '<span class="badge badge--ok">匹配成功</span>'
                  : (r.student_action === "declined" || r.teacher_action === "declined"
                      ? '<span class="badge badge--danger">已结束</span>'
                      : '<span class="badge badge--warn">等待中</span>'); } },
            { key: "created_at", label: "时间", cls: "nowrap t-xs", render: function (r) {
                return PF.esc(PF.when(r.created_at)); } },
          ], list, {
            rowAttr: function (r) { return 'title="' + PF.esc(r.reason || "") + '"'; },
            empty: {
              icon: "target", title: "还没有任何匹配记录",
              desc: "去「推荐团队」看看系统给你排的队，表态后这里会出现记录。",
              action: '<button class="btn btn--primary" id="btn-go-rec">' + PF.icon("target", 15) + "看推荐团队</button>",
            },
          }) +
        "</div></div>" +
      '<div class="mt-4">' + PF.caveat(
        "匹配分只是排序依据，不等于录取结果；最终以双方的确认意向为准。层次不参与门槛判定，也不用于分班。") + "</div>";

    const b = PF.$("#btn-go-rec", box);
    if (b) b.addEventListener("click", function () { tabs.go("rec"); });
  }

  /* ============================================================ 刷新 */
  const rf = PF.$("#btn-refresh");
  if (rf) rf.addEventListener("click", function () { TD = null; SD = null; RD = null; tabs.reload(); });
  const ng = PF.$("#btn-new-group");
  if (ng) ng.addEventListener("click", function () { newGroupModal(); });
})();
</script>
</body>
</html>
