<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生 Copilot · 寻径教育 PathFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82a0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css?v=34">
<script>/* 主题引导：抢在首帧之前定下明暗，否则会先亮一帧白再变暗。
   刻意不依赖任何外部文件与 window.PF。用户在顶栏选过则以 localStorage 为准，
   没选过就跟随系统 prefers-color-scheme。 */
(function(){var t=null;try{t=localStorage.getItem("pf_theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
  /* 两栏各自独立滚动；历史放在左侧可拖拽的抽屉里，主区只呈现当前这一轮。 */
  .qa-foot-row { display: flex; gap: 8px; align-items: flex-end; }
  .qa-foot-row .input { flex: 1 1 auto; min-width: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/js/common.js?v=17"></script>
<script src="/static/js/tabs.js"></script>
<script>
(async function () {
  const PF = window.PF;

  const me = await PF.requireAuth("student");
  if (!me) return;

  const view = PF.shell({
    active: "ask",
    me: me,
    title: "学生 Copilot",
    desc: "又能问答，又能整理：问卡住的知识点，或把图文素材交给它 —— 解析、抽知识点、给溯源，还能存成笔记放进「我的资料库」。",
    wide: true,
    actions:
      PF.demoMenuHtml([
        { key: "text", icon: "file", label: "文本素材例子", hint: "课件 / 论文：解析 + 抽知识点 + 溯源" },
        { key: "image", icon: "image", label: "图片素材例子", hint: "手写作业图：去水印 + 读图 + 答疑" },
        { key: "job", icon: "briefcase", label: "就业规划例子", hint: "问路线 → 给建议 → 帮你提交项目申请" },
      ], { label: "例子演示", tip: "挑一个，跑一遍完整流程（会真的调用接口）" }) +
      PF.chatActionsHtml(),
  });
  PF.bindDemoMenu(PF.$("[data-dm-menu]"), function (k) {
    if (k === "job") { runDemo("job"); return; }
    runDemo(k);
  });

  const META = (await PF.try(function () { return PF.get("/api/meta", { quiet: true }); }, {})) || {};
  const COURSES = PF.arr(META.my_courses);

  view.innerHTML =
    '<div class="qa-shell" id="qa-shell">' +
      '<div class="qa-dock">' +
        '<div class="sess-head">' +
          '<span class="sess-head__title">' + PF.icon("message", 14) + "对话</span>" +
          '<button class="sess-new" id="btn-new">' + PF.icon("plus", 13) + "新开对话</button>" +
        "</div>" +
        '<div class="sess-list" id="qa-history"></div>' +
      "</div>" +
      '<div class="qa-grip" id="qa-grip" role="separator" aria-orientation="vertical" tabindex="0"></div>' +
      '<div class="qa-main">' +
        '<div class="qa-main__scroll" id="chat">' + PF.loading("正在读取对话") + "</div>" +
        '<div class="qa-main__foot">' +
          '<div class="row" style="gap:8px;margin-bottom:8px">' +
            /* 范围下拉：学业（按课程收窄）与事业（就业与发展）两条路都要能选，
               只给课程会让人以为这里只能问课内的东西。
               值用前缀区分类型：course:<课程名> 限定课程，career 切到事业取向。 */
            '<select class="select select--sm" id="c-scope" style="width:172px">' +
              '<option value="">不限范围</option>' +
              (COURSES.length
                ? '<optgroup label="学业 · 课程">' + COURSES.map(function (c) {
                    return '<option value="course:' + PF.esc(c) + '">课程 · ' + PF.esc(c) + "</option>";
                  }).join("") + "</optgroup>"
                : "") +
              '<option value="career">事业 · 就业与发展</option>' +
            "</select>" +
            '<select class="select select--sm" id="c-top" style="width:110px">' +
              '<option value="4">引用 4 段</option><option value="6">引用 6 段</option>' +
              '<option value="2">引用 2 段</option></select>' +
            PF.ragSelect("c-rag", "auto", 116) +
            '<div class="spacer"></div>' +
            '<span class="t-xs t-dim">Ctrl / ⌘ + Enter 发送</span>' +
          "</div>" +
          '<div class="qa-foot-row">' +
            '<textarea class="input" id="c-input" rows="2" ' +
              'placeholder="把问题写具体一点，例如：注意力机制为什么要除以根号 d_k？"></textarea>' +
            '<button class="btn btn--primary" id="btn-send">' + PF.icon("send", 15) + "提问</button>" +
          "</div>" +
        "</div>" +
      "</div>" +
      '<div class="qa-side">' +
        /* 风格卡放在智能体卡前面：agent-card 很长，放在后面会被挤出首屏，
           看起来像「文字不见了」（v7.21 调整）。 */
        '<div class="card"><div class="card__head"><h3>本次答疑风格</h3></div>' +
          '<div class="card__body stack-sm">' +
            '<dl class="style-grid">' +
              "<dt>主标签</dt><dd id=\"s-track\">—</dd>" +
              "<dt>学业层次</dt><dd id=\"s-level\">—</dd>" +
              "<dt>讲解风格</dt><dd id=\"s-style\">—</dd>" +
              "<dt>回答引擎</dt><dd id=\"s-engine\">—</dd>" +
            "</dl>" +
            '<div id="s-caveat"></div>' +
          "</div></div>" +
        '<div id="agent-card" class="mt-4"></div>' +
      "</div>" +
    "</div>";

  /* ---------------------------------------------------------- 布局 */
  const shell = PF.$("#qa-shell");
  PF.fitHeight(shell, 24);
  const dock = PF.bindDock({ shell: shell, grip: PF.$("#qa-grip"), open: false });
  PF.$("#btn-hist").addEventListener("click", function () { dock.toggle(); });

  /* ---------------------------------------------------------- 数据：一轮对话 */
  const API_BASE = "/api/tutor";
  let ROUNDS = [];      // [{q, a, refs, layer, engine, at, qa, rag}]
  let CURRENT = -1;     // 当前展示第几轮，-1 表示还没问过

  function groupRounds(msgs) {
    const out = [];
    for (let i = 0; i < msgs.length; i++) {
      const m = msgs[i];
      if (m.role !== "user") continue;
      const ans = msgs[i + 1] && msgs[i + 1].role === "assistant" ? msgs[i + 1] : null;
      out.push({
        q: m.content || "", at: m.created_at || "",
        a: ans ? ans.content : "", refs: PF.arr(ans && ans.refs),
        layer: (ans && ans.layer) || "", engine: (ans && ans.engine) || "",
        qa: null, rag: null,   // 历史轮次不带协议块，只有当前这一轮有
      });
    }
    return out;
  }

  /* ---------------------------------------------------------- 会话：新开 / 回到某一次 */
  // el 传 null：会话与「本次对话的每一轮」要画在同一个滚动区里，由 paintDock 统一渲染。
  const sess = PF.sessionList({ el: null, api: API_BASE, onPick: function (sid) { loadHistory(sid); } });

  PF.$("#btn-new").addEventListener("click", async function () {
    await sess.create();
    ROUNDS = []; CURRENT = -1;
    paintRound(-1);
    PF.toast("已新开一次对话", "ok");
  });

  function paintDock() {
    const box = PF.$("#qa-history");
    const list = sess.items || [];
    let html = '<div class="sess-sec">全部会话（' + list.length + "）</div>";
    html += list.length
      ? list.map(function (s) {
          return '<button class="qa-dock__item' + (s.session_id === sess.current ? " is-on" : "") +
            '" data-sid="' + PF.esc(s.session_id) + '">' +
            '<div class="qa-dock__q">' + PF.esc(PF.trunc(s.title || "（空会话）", 28)) + "</div>" +
            '<div class="qa-dock__t">' + PF.num(s.turns, 0) + " 条 · " +
            PF.esc(PF.when(s.last_at)) + "</div></button>";
        }).join("")
      : '<div class="t-xs t-dim" style="padding:2px 4px 8px">还没有对话，点上面「新开对话」。</div>';

    if (ROUNDS.length) {
      html += '<div class="sess-sec">本次对话（' + ROUNDS.length + "）</div>" +
        ROUNDS.map(function (r, i) {
          return '<button class="qa-dock__item is-turn' + (i === CURRENT ? " is-on" : "") +
            '" data-r="' + i + '">' +
            '<div class="qa-dock__q">' + PF.esc(PF.trunc(r.q || "（空）", 34)) + "</div>" +
            '<div class="qa-dock__t">' + PF.esc(PF.when(r.at)) +
            (r.rag && r.rag.strategy_name ? " · " + PF.esc(r.rag.strategy_name) : "") + "</div></button>";
        }).join("");
    }
    box.innerHTML = html;
    PF.$$("[data-sid]", box).forEach(function (b) {
      b.addEventListener("click", function () { sess.pick(b.dataset.sid); });
    });
    PF.$$("[data-r]", box).forEach(function (b) {
      b.addEventListener("click", function () { paintRound(Number(b.dataset.r)); });
    });
  }

  function renderMsg(m) {
    const isUser = m.role === "user";
    const refs = PF.arr(m.refs);
    return '<div class="msg ' + (isUser ? "msg--user" : "msg--ai") + '">' +
      '<div class="msg__avatar">' + (isUser ? PF.esc(PF.initial(me.name)) : "AI") + "</div>" +
      '<div class="msg__bubble">' +
        '<div class="msg__meta">' +
          '<span class="t-xs t-strong">' + (isUser ? "我" : "AI 助教") + "</span>" +
          (m.layer ? '<span class="badge badge--brand">' + PF.esc(m.layer) + "</span>" : "") +
          (!isUser ? PF.engineBadge(m.engine) : "") +
          '<div class="spacer"></div>' +
          '<span class="t-xs t-dim">' + PF.esc(PF.when(m.created_at)) + "</span>" +
        "</div>" +
        PF.esc(m.content || "") +
        (m.attach || "") +
        (!isUser && m.demo ? PF.demoAnswerBody(m.demo, FOLDERS, "student") : "") +
        (!isUser && m.guide ? PF.demoGuideBody(m.guide, m.guideKey, FOLDERS, "student") : "") +
        (refs.length ? '<div class="t-xs mt-3" style="color:var(--ink-500)">依据：' +
          refs.slice(0, 3).map(function (r) { return "[" + PF.esc(r) + "]"; }).join(" ") + "</div>" : "") +
        (!isUser && m.rag ? PF.ragCard(m.rag) : "") +
        (!isUser && m.synth ? PF.synthCard(m.synth) : "") +
        PF.qaBlock(m.qa) +
      "</div></div>";
  }

  function paintRound(i) {
    CURRENT = i;
    const chat = PF.$("#chat");
    if (i < 0 || !ROUNDS[i]) {
      chat.innerHTML =
        '<div class="msg msg--ai"><div class="msg__avatar">AI</div>' +
          '<div class="msg__bubble">' +
          PF.esc((me && me.name) ? me.name + "同学你好，我是助教小寻。" : "你好，我是助教小寻。") +
          "学业上的问题、就业与发展的打算，都可以问我。" +
          "提问时我会先看你的画像，再决定从哪里讲起、讲多深；" +
          "答案只引用库里能溯源的材料，没有依据的地方会直接说明。\n\n" +
          "可以先问一个你最近卡住的知识点，也可以问问简历和岗位准备。左侧「对话」里能新开一次，也能回到以前某一次继续问。</div></div>";
      paintDock();
      return;
    }
    const r = ROUNDS[i];
    if (r.demo) {
      chat.innerHTML =
        renderMsg({ role: "user", content: r.q, created_at: r.at, attach: r.attach }) +
        renderMsg({ role: "assistant", content: "", created_at: r.at,
                    layer: r.layer || "资料解析", engine: "rule", refs: [], demo: r.demo });
      bindFollowups(chat);
      PF.bindNoteSaver(chat, { onSaved: function () { sess.refresh(); } });
      PF.bindGuides(chat, { onPick: runGuide });
      paintDock();
      scrollBottom();
      return;
    }
    if (r.guide) {
      chat.innerHTML =
        renderMsg({ role: "user", content: r.q, created_at: r.at, attach: r.attach }) +
        renderMsg({ role: "assistant", content: "", created_at: r.at,
                    layer: r.layer, engine: "rule", refs: [],
                    guide: r.guide, guideKey: r.guideKey });
      PF.bindNoteSaver(chat, { onSaved: function () { sess.refresh(); } });
      paintDock();
      scrollBottom();
      return;
    }
    chat.innerHTML =
      renderMsg({ role: "user", content: r.q, created_at: r.at, refs: [] }) +
      (r.a ? renderMsg({ role: "assistant", content: r.a, layer: r.layer, engine: r.engine,
                         created_at: r.at, refs: r.refs, qa: r.qa, rag: r.rag,
                         synth: r.synth }) : "");
    bindFollowups(chat);
    setStyle(r.layer, r.engine);
    paintDock();
    scrollBottom();
  }

  function scrollBottom() {
    const el = PF.$("#chat");
    el.scrollTop = el.scrollHeight;
  }

  /* 追问建议：点一下直接接着问 */
  function bindFollowups(scope) {
    PF.$$("[data-fu]", scope).forEach(function (b) {
      b.addEventListener("click", function () {
        PF.$("#c-input").value = b.dataset.fu;
        send();
      });
    });
  }

  /* ---------------------------------------------------------- 右侧面板 */
  function setStyle(layer, engine) {
    const parts = String(layer || "").split("·").map(function (s) { return s.trim(); });
    PF.$("#s-track").innerHTML = parts[0] ? PF.trackBadge(parts[0]) : "—";
    /* 学业层次只留层级徽章（绿色的 A/B/C），后面的「X 层」小字冗余，去掉（v7.23） */
    PF.$("#s-level").innerHTML = parts[1] ? PF.levelTag(parts[1].replace("级", "").replace(/层$/, "").trim()) : "—";
    PF.$("#s-style").textContent = parts[2] || "—";
    PF.$("#s-engine").innerHTML = engine ? PF.engineBadge(engine) : "—";
    PF.$("#s-caveat").innerHTML = PF.caveat(META.caveats && META.caveats.layer
      ? META.caveats.layer
      : "分层只用于决定推荐内容深度与任务难度，不用于分班、不产生标签。");
  }

  /* ---------------------------------------------------------- 智能体简介卡 */
  (async function loadAgentCard() {
    const m = await PF.try(function () { return PF.get("/api/manual", { quiet: true }); }, null);
    const a = (m && m.agents && m.agents.student) || {
      name: "学习助手",
      one_line: "卡住了就问它。它会按你现在的进度决定从哪里讲起、讲多深。",
      answers: ["概念辨析", "作业卡点", "方法步骤", "路径规划", "资源获取"],
      how: "先确认你问的是什么 → 按你的进度讲 → 标出出处 → 给你下一步",
      ground: "只引用老师上传的资料，没找到会直接说明，不会编",
      caveat: "讲解深度因人而异，这只是内容深浅，不代表分班。",
    };
    PF.$("#agent-card").innerHTML = PF.agentCard(Object.assign({ btnId: "btn-manual" }, a));
    PF.$("#btn-manual").addEventListener("click", function () { PF.manual("qa"); });
  })();

  /* ---------------------------------------------------------- 提问 */
  async function send() {
    const input = PF.$("#c-input");
    const q = input.value.trim();
    if (!q) { PF.toast("请先输入问题", "warn"); return; }
    const btn = PF.$("#btn-send");

    // 先把问题放到主区，回答到位后再补上
    ROUNDS.push({ q: q, a: "", refs: [], layer: "", engine: "",
                  at: new Date().toISOString(), qa: null, rag: null });
    const strategy = PF.$("#c-rag").value || "auto";
    CURRENT = ROUNDS.length - 1;
    PF.$("#chat").innerHTML =
      renderMsg({ role: "user", content: q, created_at: ROUNDS[CURRENT].at, refs: [] }) +
      '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
        '<div class="msg__meta"><span class="t-xs t-strong">AI 助教</span>' +
        '<span class="t-xs t-dim">正在按你的画像组织答案并检索课件…</span></div>' +
        '<span class="spin"></span></div></div>';
    input.value = "";
    PF.busy(btn, true, "生成中");
    scrollBottom();
    paintDock();

    try {
      const scopeVal = PF.$("#c-scope").value;
      const d = await PF.post("/api/tutor/ask", {
        question: q,
        course: scopeVal.indexOf("course:") === 0 ? scopeVal.slice(7) : "",
        /* 选了「事业 · 就业与发展」就按事业取向组织这一轮（不按课程收窄检索，
           简历 / 岗位 / 项目这类不带课程名的材料才检索得到） */
        focus: scopeVal === "career" ? "事业型" : "",
        top_k: Number(PF.$("#c-top").value),
        session_id: sess.current,          // 不传后端会新开一次；传了就续上这一轮
        strategy: strategy,                // auto = 按问题自动选五种架构之一
      });
      ROUNDS[CURRENT] = {
        q: q, a: d.answer, refs: PF.arr(d.refs), layer: d.layer, engine: d.engine,
        at: new Date().toISOString(), qa: d, rag: d.rag || null, synth: d.synth || null,
      };
      sess.current = d.session_id || sess.current;
      await sess.refresh();
      paintRound(CURRENT);
    } catch (e) {
      ROUNDS[CURRENT].a = "生成失败：" + e.message;
      paintRound(CURRENT);
    } finally { PF.busy(btn, false); }
  }

  /* ---------------------------------------------------------- 演示例子（写死）
     「文本例子 / 图片例子」两个按钮：把一份素材交给 Copilot，
     直接给出整理结果 + 溯源排序，并询问是否存成笔记进「我的资料库」。 */
  const CATS = (await PF.try(function () {
    return PF.get("/api/materials/overview", { quiet: true });
  }, null)) || {};
  const FOLDERS = PF.arr(CATS.categories);

  function runDemo(key) {
    const demo = PF.COPILOT_DEMOS[key];
    if (!demo) return;
    const at = new Date().toISOString();
    const layer = demo.layer || "资料解析";
    const busyText = demo.material
      ? "正在解析" + PF.esc(demo.kind) + "素材、抽取知识点，并检索相关课件做溯源…"
      : "正在结合你的画像与库里的课程/就业资料组织路线，并检索可溯源的依据…";
    ROUNDS.push({ q: demo.prompt, a: "", refs: [], layer: layer, engine: "rule",
                  at: at, qa: null, rag: null, demo: demo, attach: PF.demoAttach(demo) });
    CURRENT = ROUNDS.length - 1;
    paintDock();
    PF.$("#chat").innerHTML =
      renderMsg({ role: "user", content: demo.prompt, created_at: at, attach: PF.demoAttach(demo) }) +
      '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
        '<div class="msg__meta"><span class="t-xs t-strong">AI 助教</span>' +
        '<span class="badge badge--brand">' + PF.esc(layer) + "</span>" + PF.engineBadge("rule") + "</div>" +
        '<span class="spin"></span> <span class="t-sm t-dim">' + busyText + "</span></div></div>";
    scrollBottom();
    setTimeout(function () { paintRound(CURRENT); }, 650);
  }

  /* 引导问答：点溯源下方的浅色按钮 → 自动上传作业图 / 出题 / 整理清单，
     650ms 后由 paintRound 画出写死的结果（上传那一步是真接口）。 */
  function runGuide(gkey) {
    PF.runCopilotGuide(gkey, {
      side: "student",
      push: function (guide, k) {
        const at = new Date().toISOString();
        const layer = guide.label || "资料解析";
        const attach = guide.attach ? PF.demoAttach(guide.attach) : "";
        ROUNDS.push({ q: guide.ask, a: "", refs: [], layer: layer, engine: "rule",
                      at: at, qa: null, rag: null,
                      guide: guide, guideKey: k, attach: attach });
        CURRENT = ROUNDS.length - 1;
        paintDock();
        PF.$("#chat").innerHTML =
          renderMsg({ role: "user", content: guide.ask, created_at: at, attach: attach }) +
          '<div class="msg msg--ai"><div class="msg__avatar">AI</div><div class="msg__bubble">' +
            '<div class="msg__meta"><span class="t-xs t-strong">AI 助教</span>' +
            '<span class="badge badge--brand">' + PF.esc(layer) + "</span>" +
            PF.engineBadge("rule") + "</div>" +
            '<span class="spin"></span> <span class="t-sm t-dim">' +
            (guide.upload ? "正在上传作业图并逐题解析…"
              : (guide.action ? "正在到资源广场找到该项目并提交申请…"
                : "正在生成结果…")) + "</span></div></div>";
        scrollBottom();
        setTimeout(function () { paintRound(CURRENT); }, 650);
        return { chat: PF.$("#chat"), side: "student" };
      },
    });
  }

  /* ---------------------------------------------------------- 历史与推荐问题 */
  async function loadHistory(sid) {
    try {
      const d = await PF.get(API_BASE + "/history?limit=60" +
        (sid ? "&session_id=" + encodeURIComponent(sid) : ""));
      ROUNDS = groupRounds(PF.arr(d.messages));
      CURRENT = ROUNDS.length ? ROUNDS.length - 1 : -1;
    } catch (e) {
      ROUNDS = []; CURRENT = -1;
    }
    paintRound(CURRENT);
  }

  // 支持 /ask?q=… 带着问题进来直接提问（原「试试这些问题」侧栏已移除，入口保留）
  (async function autoAsk() {
    const preset = new URLSearchParams(location.search).get("q");
    if (preset) { PF.$("#c-input").value = preset; send(); }
  })();

  PF.$("#btn-send").addEventListener("click", send);
  PF.$("#c-input").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); send(); }
  });

  PF.$("#btn-clear").addEventListener("click", async function () {
    const sid = sess.current;
    const yes = await PF.confirm({
      title: sid ? "清空本次对话" : "清空全部对话",
      text: sid ? "只删当前这一次对话，其他对话保留。" : "会删除你与 AI 助教的全部答疑记录，不可恢复。",
      okText: "清空", danger: true,
    });
    if (!yes) return;
    try {
      await PF.post(API_BASE + "/clear", { session_id: sid });
      ROUNDS = []; CURRENT = -1;
      await initStyle();
      await sess.refresh();
      paintRound(-1);
      PF.toast("对话已清空", "ok");
    } catch (e) { /* 已提示 */ }
  });

  /* 进页面先用画像把风格卡填上（之前初始全是「—」，看起来像没显示）；
     提问一轮后会被回答带回的 layer/engine 覆盖。清空对话后也回到这个默认。 */
  async function initStyle() {
    const d = await PF.try(function () {
      return PF.get("/api/student/profile", { quiet: true });
    }, null);
    const p = (d && d.profile) || {};
    if (p.layer) {
      setStyle(p.layer, "");
      PF.$("#s-engine").innerHTML = '<span class="t-xs t-dim">提问后确定</span>';
    }
  }

  initStyle();
  await sess.refresh();
  await loadHistory(sess.current);
})();
</script>
</body>
</html>
