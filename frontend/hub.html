<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源广场 · 寻径教育 PathFinder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82a0' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpath d='M15.5 8.5l-2 5-5 2 2-5z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/style.css?v=17">
<script>/* 主题引导：抢在首帧之前定下明暗，否则会先亮一帧白再变暗。
   刻意不依赖任何外部文件与 window.PF。用户在顶栏选过则以 localStorage 为准，
   没选过就跟随系统 prefers-color-scheme。 */
(function(){var t=null;try{t=localStorage.getItem("pf_theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();</script>
<style>
  .hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--s-4); }
  @media (max-width: 700px) { .hub-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/static/js/common.js?v=8"></script>
<script src="/static/js/tabs.js"></script>
<script>
(async function () {
  const PF = window.PF;

  const me = await PF.requireAuth("student");
  if (!me) return;

  const view = PF.shell({
    active: "hub",
    me: me,
    title: "资源广场",
    desc: "老师发布的课题组、比赛、实习与项目都在这里。申请后老师会看到你的画像标签 —— 分层只影响推荐内容深度，不会成为录用门槛。",
    wide: true,
    actions: '<button class="btn" id="btn-refresh">' + PF.icon("refresh", 15) + "刷新</button>",
  });

  view.innerHTML = '<div id="tabs-host"></div>';
  const host = PF.$("#tabs-host", view);

  const tabs = PF.tabs(host, [
    { key: "board", label: "资源广场", icon: "briefcase", render: renderBoard },
    { key: "mine", label: "我的申请", icon: "clipboard", renderMine },
  ], { base: "#/", initial: "board" });

  /* ============================================================ 资源广场 */
  async function renderBoard(box) {
    box.innerHTML = PF.loading("正在读取资源");
    let d;
    try {
      d = await PF.get("/api/resources");
    } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }

    const teachers = PF.arr(d.teachers);
    const rtypes = PF.arr(d.rtypes);
    let FTYPE = "";      // "" = 全部
    let KW = "";

    box.innerHTML =
      '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">' +
        '<button class="btn btn--sm" data-t="">全部</button>' +
        rtypes.map(function (r) {
          return '<button class="btn btn--sm" data-t="' + PF.esc(r.value) + '">' + PF.esc(r.label) + "</button>";
        }).join("") +
        '<div class="spacer"></div>' +
        '<input class="input input--sm" id="hub-kw" style="width:200px" placeholder="搜索资源名称或标签">' +
      "</div>" +
      '<div id="hub-body"></div>';

    function paint() {
      const kw = KW.toLowerCase();
      let groups = teachers.map(function (t) {
        const items = PF.arr(t.resources).filter(function (r) {
          if (FTYPE && r.rtype !== FTYPE) return false;
          if (!kw) return true;
          const hay = [r.title, r.detail, PF.arr(r.tags).join(" ")].join(" ").toLowerCase();
          return hay.indexOf(kw) >= 0;
        });
        return Object.assign({}, t, { resources: items });
      }).filter(function (t) { return t.resources.length; });

      const total = groups.reduce(function (a, t) { return a + t.resources.length; }, 0);
      if (!total) {
        PF.$("#hub-body", box).innerHTML = PF.empty({
          icon: "briefcase",
          title: teachers.length ? "没有符合条件的资源" : "暂时没有可申请的资源",
          desc: teachers.length
            ? "换个类型或关键词试试。"
            : "教师发布资源后会自动出现在这里，可以先去「我的画像」看看系统给你推荐的方向。",
        });
        return;
      }

      PF.$("#hub-body", box).innerHTML = groups.map(function (t) {
        return '<div class="teacher-head">' +
            '<div class="teacher-head__ava">' + PF.esc(PF.initial(t.name)) + "</div>" +
            '<div class="flex-1"><div class="t-strong" style="font-size:13.5px">' + PF.esc(t.name) + "</div>" +
              (PF.arr(t.directions).length
                ? '<div class="t-xs t-dim">' + PF.esc(PF.arr(t.directions).join(" / ")) + "</div>"
                : (t.summary ? '<div class="t-xs t-dim">' + PF.esc(PF.trunc(t.summary, 50)) + "</div>" : "")) +
            "</div>" +
            '<span class="badge">' + t.resources.length + " 条</span>" +
          "</div>" +
          '<div class="hub-grid mt-4">' + t.resources.map(cardHtml).join("") + "</div>";
      }).join("");

      PF.$$("[data-apply]", box).forEach(function (b) {
        b.addEventListener("click", function () {
          const r = findResource(Number(b.dataset.apply));
          if (r) applyModal(r, box);
        });
      });
    }

    function findResource(id) {
      let hit = null;
      teachers.forEach(function (t) {
        PF.arr(t.resources).forEach(function (r) { if (r.id === id) hit = r; });
      });
      return hit;
    }

    function cardHtml(r) {
      const mine = r.my_application;
      const accepted = r.accepted || 0;
      const full = r.capacity > 0 && accepted >= r.capacity;
      const closed = r.status !== "open";

      let action;
      if (mine && mine.status === "pending") {
        action = '<span class="badge badge--warn">' + PF.icon("clock", 11) + " 申请待处理</span>";
      } else if (mine && mine.status === "accepted") {
        action = '<span class="badge badge--ok">' + PF.icon("check", 11) + " 已通过</span>";
      } else if (mine && mine.status === "declined") {
        action = '<span class="badge badge--danger">' + PF.icon("x", 11) + " 已婉拒</span>";
      } else if (closed) {
        action = '<span class="badge">已停止接收</span>';
      } else if (full) {
        action = '<span class="badge badge--danger">名额已满</span>';
      } else {
        action = '<button class="btn btn--sm btn--primary" data-apply="' + r.id + '">' +
          PF.icon("send", 12) + "申请</button>";
      }

      return '<div class="hub-card">' +
        '<div class="hub-card__head">' +
          '<div class="row" style="gap:6px;margin-bottom:6px;flex-wrap:wrap">' +
            '<span class="badge badge--brand">' + PF.esc(r.rtype_label || "") + "</span>" +
            (r.pending > 0 ? '<span class="badge badge--info">' + r.pending + " 人申请中</span>" : "") +
            (r.deadline ? '<span class="t-xs t-dim">截止 ' + PF.esc(PF.date(r.deadline)) + "</span>" : "") +
          "</div>" +
          '<div class="hub-card__title">' + PF.esc(r.title || "") + "</div>" +
        "</div>" +
        '<div class="hub-card__body">' +
          (r.detail
            ? '<p class="t-sm" style="line-height:1.75;color:var(--ink-700);margin:0">' +
              PF.esc(PF.trunc(r.detail, 180)) + "</p>"
            : '<span class="t-dim t-sm">暂无说明</span>') +
          (PF.arr(r.tags).length
            ? '<div class="row" style="gap:5px;margin-top:9px;flex-wrap:wrap">' +
              PF.arr(r.tags).map(function (t) { return '<span class="chip">' + PF.esc(t) + "</span>"; }).join("") +
              "</div>"
            : "") +
          '<div class="seat mt-3">' + PF.icon("users", 12) +
            " 已通过 " + PF.num(accepted, 0) + " 人" +
            (r.capacity > 0 ? " · 名额 " + PF.num(r.capacity, 0) + " 人" : " · 不限名额") +
          "</div>" +
        "</div>" +
        '<div class="hub-card__foot">' +
          (mine && mine.teacher_reply
            ? '<div class="t-xs" style="color:var(--ink-600)">老师回复：' + PF.esc(PF.trunc(mine.teacher_reply, 40)) + "</div>"
            : '<div class="t-xs t-dim">' + PF.esc(PF.when(r.created_at)) + " 发布</div>") +
          '<div class="spacer"></div>' + action +
        "</div>" +
      "</div>";
    }

    PF.$$("[data-t]", box).forEach(function (b) {
      b.addEventListener("click", function () {
        FTYPE = b.dataset.t;
        PF.$$("[data-t]", box).forEach(function (x) { x.classList.toggle("btn--primary", x === b); });
        paint();
      });
    });
    PF.$("#hub-kw", box).addEventListener("input", PF.debounce(function (e) {
      KW = e.target.value.trim();
      paint();
    }, 220));

    const first = PF.$('[data-t=""]', box);
    if (first) first.classList.add("btn--primary");
    paint();
  }

  function applyModal(r, box) {
    if (!r) return;
    PF.modal({
      title: "申请：" + PF.trunc(r.title, 24),
      width: "narrow",
      body:
        '<div class="stack-sm">' +
          '<div class="row" style="gap:6px">' +
            '<span class="badge badge--brand">' + PF.esc(r.rtype_label || "") + "</span>" +
            '<span class="badge">' + PF.num(r.accepted, 0) + " 人已通过</span>" +
          "</div>" +
          '<label class="t-sm t-strong">给老师的一段话</label>' +
          '<textarea class="input" id="ap-msg" rows="4" ' +
            'placeholder="简单说说你为什么想参加、能投入多少时间、相关经历"></textarea>' +
          PF.caveat("申请时老师能看到你的主标签与层次标签 —— 它们表示的是推荐内容深度，不是能力评定，也不会成为筛选门槛。") +
        "</div>",
      actions: [
        { label: "取消" },
        { label: "提交申请", type: "primary", onClick: async function () {
            try {
              await PF.post("/api/resources/" + r.id + "/apply", {
                message: (PF.$("#ap-msg") && PF.$("#ap-msg").value.trim()) || "",
              });
              PF.toast("申请已提交，等待教师处理", "ok");
              tabs.reload();
            } catch (e) { return true; }
          } },
      ],
    });
  }

  /* ============================================================ 我的申请 */
  async function renderMine(box) {
    box.innerHTML = PF.loading("正在读取我的申请");
    let d;
    try {
      d = await PF.get("/api/resources/applications/mine");
    } catch (e) {
      box.innerHTML = PF.empty({ icon: "alert", title: "读取失败", desc: e.message });
      return;
    }
    const apps = PF.arr(d.applications);
    const pending = apps.filter(function (a) { return a.status === "pending"; }).length;
    const accepted = apps.filter(function (a) { return a.status === "accepted"; }).length;

    box.innerHTML =
      '<div class="grid grid-3">' +
        '<div class="stat"><div class="stat__ico">' + PF.icon("send", 18) + "</div>" +
          '<div class="flex-1"><div class="stat__num">' + apps.length + "</div>" +
          '<div class="stat__label">累计申请</div></div></div>' +
        '<div class="stat"><div class="stat__ico stat__ico--warn">' + PF.icon("clock", 18) + "</div>" +
          '<div class="flex-1"><div class="stat__num">' + pending + "</div>" +
          '<div class="stat__label">待处理</div></div></div>' +
        '<div class="stat"><div class="stat__ico stat__ico--ok">' + PF.icon("check", 18) + "</div>" +
          '<div class="flex-1"><div class="stat__num">' + accepted + "</div>" +
          '<div class="stat__label">已通过</div></div></div>' +
      "</div>" +

      '<div class="card mt-5"><div class="card__head"><h3>' + PF.icon("clipboard", 15) + " 我的申请记录</h3></div>" +
        '<div class="card__body card__body--flush">' +
          PF.table([
            { key: "resource_title", label: "资源", render: function (a) {
                return '<div class="t-strong">' + PF.esc(a.resource_title || "—") + "</div>" +
                  '<div class="t-xs t-dim">' + PF.esc(a.rtype_label || "") + " · " +
                  PF.esc(a.teacher_name || "") + " 发布</div>";
              } },
            { key: "message", label: "我的留言", render: function (a) {
                return a.message
                  ? '<span class="t-sm">' + PF.esc(PF.trunc(a.message, 40)) + "</span>"
                  : '<span class="t-dim t-sm">—</span>';
              } },
            { key: "status_text", label: "状态", render: function (a) {
                return PF.statusBadge(a.status_text || "");
              } },
            { key: "teacher_reply", label: "老师回复", render: function (a) {
                return a.teacher_reply
                  ? '<span class="t-sm">' + PF.esc(PF.trunc(a.teacher_reply, 40)) + "</span>"
                  : '<span class="t-dim t-sm">—</span>';
              } },
            { key: "created_at", label: "申请时间", render: function (a) {
                return '<span class="t-sm">' + PF.esc(PF.when(a.created_at)) + "</span>";
              } },
          ], apps, {
            empty: {
              icon: "briefcase",
              title: "还没有申请记录",
              desc: "去「资源广场」看看老师们发布了什么，申请后会在这里看到处理进度。",
              action: '<button class="btn btn--primary" id="btn-go-board">' + PF.icon("briefcase", 15) + "去资源广场</button>",
            },
          }) +
        "</div>" +
        '<div class="card__foot"><span class="t-xs t-dim">' +
          "通过后系统会自动在你的「我的画像 → 我的任务」里生成一条跟进任务。" +
        "</span></div></div>";

    const b = PF.$("#btn-go-board", box);
    if (b) b.addEventListener("click", function () { tabs.go("board"); });
  }

  PF.$("#btn-refresh").addEventListener("click", function () { tabs.reload(); });
})();
</script>
</body>
</html>
